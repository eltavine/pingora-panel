# Advisories against rustls-webpki 0.101.7, pulled in transitively by
# aws-sdk-s3-transfer-manager through the legacy rustls 0.21 chain used by
# dial9's worker-s3 feature. No patch exists in 0.101.x; not reachable in
# our usage because this is TLS client use only and does not parse CRLs.
# Remove once Pingora migrates to the Dial9 release line that removed
# aws-sdk-s3-transfer-manager.

[advisories]
ignore = [
    # paste is a compile-time macro reached only through foundations'
    # optional Linux memory-profiling feature via tikv-jemalloc-ctl, whose
    # released versions all still depend on it.
    "RUSTSEC-2024-0436", # paste: no longer maintained
    "RUSTSEC-2026-0098", # rustls-webpki: URI name constraints incorrectly accepted
    "RUSTSEC-2026-0099", # rustls-webpki: name constraints accepted for wildcard certs
    "RUSTSEC-2026-0104", # rustls-webpki: reachable panic in CRL parsing
    # h2 0.3.27 is pulled in only by the optional worker-s3 dependency chain.
    # The feature is disabled by default, but users who enable it remain affected.
    "RUSTSEC-2026-0258", # h2: unbounded empty DATA frames
    # The optional worker-s3 legacy client uses rustls 0.21's built-in session
    # cache and classical-only key exchange groups. These scoped exceptions
    # expire on 2026-12-15; Panel uses patched rustls 0.23.46.
    "RUSTSEC-2026-0346", # no session-value Debug logging in the legacy client
    "RUSTSEC-2026-0349", # no post-quantum group in rustls 0.21
]
