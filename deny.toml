# Dependency policy shared by the vendored Pingora and Panel workspaces.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

# Keep this exception set synchronized with .cargo/audit.toml. The dedicated
# policy guard rejects drift between cargo-deny and cargo-audit.
[advisories]
# A yanked release is an unreviewed supply-chain state, so a local
# `cargo deny check` blocks on one. CI downgrades it to a warning in the native
# cargo-deny job and lets check-rust-dependency-leases.py decide, exactly as it
# does for unmaintained findings, so exposure must be accounted for in
# .github/policies/rust-dependency-leases.json rather than merely tolerated.
yanked = "deny"
ignore = [
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0258",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
# Duplicate, unmaintained, and yanked findings are accounted for in
# .github/policies/rust-dependency-leases.json instead of failing here. That
# guard holds each workspace to the enforcement its reproducibility supports:
# exact per-finding leases where a lockfile is committed, and leased count
# ceilings where the lockfile is untracked and re-resolves on every run.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Keep the minimum patched release explicit even if an advisory database is
# temporarily stale. cargo-deny owns version-range enforcement here, so no
# repository-specific dependency scanner is needed.
deny = [
    { crate = "time@<0.3.47", reason = "RUSTSEC-2026-0009 is fixed in time 0.3.47 and later" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
