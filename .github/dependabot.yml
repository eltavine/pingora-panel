version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # One entry per Cargo workspace root. check-dependabot-coverage.py fails the
  # build when a workspace is added without a matching entry here.
  # The root workspace is upstream Pingora, changed only for security or
  # correctness fixes (docs/upstream-patches.md): a limit of zero stops its
  # version updates and keeps its security updates.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: /panel
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /panel/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /panel/deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /panel/deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
