name: panel-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "panel/**"
      - ".dockerignore"
      - ".github/workflows/panel-deploy.yml"
  pull_request:
    paths:
      - "panel/deploy/**"
      - ".dockerignore"
      - ".github/workflows/panel-deploy.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Build the image and run the Compose installation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSE_FILE: panel/deploy/compose.yaml:panel/deploy/compose.ops-agent.yaml
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Generate installation secrets
        run: panel/deploy/generate-secrets.sh

      - name: Validate the Compose file
        run: docker compose config --quiet

      - name: Build the image
        run: docker compose build

      - name: Install the host agent
        run: |
          sudo env PINGORA_PANEL_IMAGE=localhost/pingora-panel:dev \
            panel/deploy/ops-agent/install.sh directories listeners containers
          sudo systemd-analyze verify \
            /etc/systemd/system/pingora-panel-ops-agent.service \
            /etc/systemd/system/pingora-panel-ops-agent-credentials.service \
            /etc/systemd/system/pingora-panel-ops-agent-credentials.path

      - name: Start the installation
        run: docker compose up --detach

      - name: Wait for every control-plane module to become ready
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error "http://127.0.0.1:9180/readyz" >/dev/null; then
              break
            fi
            sleep 5
          done
          for port in 9180 9181 9182 9183 9184 9186; do
            curl --fail --silent --show-error "http://127.0.0.1:${port}/readyz" >/dev/null
          done

      - name: Create the first account and an API token
        run: |
          password=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | cut -c1-32)
          echo "::add-mask::$password"
          printf '%s\n' "$password" | docker compose exec -T control ppanel setup \
            --username ci --bootstrap-token-file /run/secrets/bootstrap-token --password-stdin
          session=$(curl --fail --silent --show-error --header 'content-type: application/json' \
            --data "{\"username\": \"ci\", \"password\": \"$password\", \"transport\": \"bearer\"}" \
            http://127.0.0.1:8080/api/v1/session \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['secret'])")
          echo "::add-mask::$session"
          token=$(docker compose exec -T -e PPANEL_TOKEN="$session" control ppanel -o json \
            token create ci --days 1 \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['secret'])")
          echo "::add-mask::$token"
          echo "PPANEL_TOKEN=$token" >> "$GITHUB_ENV"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8080/api/v1/gateway/status)" -eq 401

      - name: Check publication and discovery through the API
        run: |
          auth="Authorization: Bearer $PPANEL_TOKEN"
          curl --fail --silent --show-error --header "$auth" http://127.0.0.1:8080/api/v1/gateway/status
          services=$(curl --fail --silent --show-error --header "$auth" \
            http://127.0.0.1:8080/api/v1/platform/services \
            | python3 -c "import json, sys; print(len(json.load(sys.stdin)['services']))")
          test "$services" -eq 6
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/

      - name: Reach the host agent through the API
        run: |
          auth="Authorization: Bearer $PPANEL_TOKEN"
          agent() {
            curl --fail --silent --show-error --header "$auth" http://127.0.0.1:8080/api/v1/host/agent \
              | python3 -c "import json, sys; print(json.load(sys.stdin)['status'])"
          }
          for _ in $(seq 1 30); do
            if [ "$(agent)" = connected ]; then
              break
            fi
            sleep 2
          done
          test "$(agent)" = connected
          curl --fail --silent --show-error --header "$auth" \
            http://127.0.0.1:8080/api/v1/host/directories \
            | python3 -c "import json, sys; found = json.load(sys.stdin)['directories']; assert len(found) == 3 and all(d['present'] for d in found), found"
          curl --fail --silent --show-error --header "$auth" \
            'http://127.0.0.1:8080/api/v1/host/listeners?ports=8080' \
            | python3 -c "import json, sys; found = json.load(sys.stdin)['listeners']; assert any(p['name'] == 'panel-control' for l in found for p in l['processes']), found"
          docker compose exec -T -e PPANEL_TOKEN control ppanel host agent
          docker compose exec -T -e PPANEL_TOKEN control ppanel host directories
          docker compose exec -T -e PPANEL_TOKEN control ppanel host listeners --port 8080
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          state() {
            ppanel -o json host gateway-service \
              | python3 -c "import json, sys; print(json.load(sys.stdin)['container']['state'])"
          }
          gateway_ready() {
            for _ in $(seq 1 30); do
              if curl --fail --silent --output /dev/null http://127.0.0.1:9185/readyz; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          ppanel host gateway-service
          test "$(state)" = running
          ppanel --timeout 120 host gateway-service restart --yes
          test "$(state)" = running
          gateway_ready
          ppanel --timeout 120 host gateway-service stop --yes
          test "$(state)" = exited
          # The gateway itself is down, not just reported so.
          if curl --silent --output /dev/null --max-time 2 http://127.0.0.1:9185/livez; then
            exit 1
          fi
          ppanel --timeout 120 host gateway-service start
          test "$(state)" = running
          gateway_ready
          for _ in $(seq 1 30); do
            if ppanel -o json audit list --type host.gateway_service.restarted --actor-id ci \
              | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"; then
              break
            fi
            sleep 1
          done
          ppanel -o json audit list --type host.gateway_service.restarted --actor-id ci \
            | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"

      - name: Reach the containers through the host agent
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          engines() {
            ppanel -o json container engines \
              | python3 -c "import json, sys; print(' '.join(f\"{e['id']}:{e['enabled']}:{e['reachable']}\" for e in json.load(sys.stdin)['engines']))"
          }
          test "$(engines)" = docker:True:True
          ppanel container engine disable docker
          test "$(engines)" = docker:False:True
          # The choice outlives the agent.
          sudo systemctl restart pingora-panel-ops-agent.service
          for _ in $(seq 1 30); do
            if [ "$(engines 2>/dev/null)" = docker:False:True ]; then
              break
            fi
            sleep 2
          done
          test "$(engines)" = docker:False:True
          ppanel container engine enable docker
          ppanel container engines
          ppanel -o json container list --state running \
            | python3 -c "import json, sys; found = json.load(sys.stdin)['containers']; assert any(c['compose_project'] == 'pingora-panel' for c in found), found"
          ppanel container list --search pingora-panel-control
          # A throwaway container from an image the installation already has.
          docker run --detach --name panel-ci-throwaway \
            "$(docker compose config --images | grep '/nats:')" >/dev/null
          status() { docker inspect --format '{{.State.Status}}' panel-ci-throwaway; }
          ppanel container stop panel-ci-throwaway --yes
          test "$(status)" = exited
          ppanel container start panel-ci-throwaway
          test "$(status)" = running
          ppanel container restart panel-ci-throwaway --yes
          test "$(status)" = running
          ppanel -o json container inspect panel-ci-throwaway \
            | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['container']['names'] == ['panel-ci-throwaway'] and d['started_at'], d"
          ppanel -o json container inspect pingora-panel-control-1 \
            | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['container']['labels']['com.docker.compose.service'] == 'control', d"
          # What it printed, then what it prints until it stops.
          ppanel -o json container logs panel-ci-throwaway --lines 50 \
            | python3 -c "import json, sys; lines = json.load(sys.stdin)['lines']; assert any('Server is ready' in line['text'] for line in lines), lines"
          timeout 60 docker compose exec -T -e PPANEL_TOKEN control \
            ppanel -o json container logs panel-ci-throwaway --follow --lines 1 > followed.jsonl &
          follower=$!
          for _ in $(seq 1 30); do
            if [ -s followed.jsonl ]; then
              break
            fi
            sleep 1
          done
          docker stop panel-ci-throwaway >/dev/null
          wait "$follower"
          test "$(wc -l < followed.jsonl)" -ge 2
          ppanel container start panel-ci-throwaway
          test "$(status)" = running
          # What it uses, alone and among every running container.
          ppanel -o json container stats panel-ci-throwaway \
            | python3 -c "import json, sys; s = json.load(sys.stdin); assert s['name'] == 'panel-ci-throwaway' and s['pids'] >= 1 and s['memory_bytes'] > 0 and s['read_at'], s"
          ppanel -o json container stats \
            | python3 -c "import json, sys; names = [s['name'] for s in json.load(sys.stdin)['stats']]; assert {'panel-ci-throwaway', 'pingora-panel-control-1'} <= set(names), names"
          ppanel container stats
          # Images: listed with the containers made from them, inspected, and
          # removed unless the installation uses them.
          nats_image="$(docker compose config --images | grep '/nats:')"
          ppanel -o json image list --search nats \
            | python3 -c "import json, sys; images = json.load(sys.stdin)['images']; assert any(i['containers'] >= 2 for i in images), images"
          ppanel -o json image inspect "$nats_image" \
            | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['os'] == 'linux' and d['layers'] >= 1, d"
          if ppanel image remove "$nats_image" --force --yes; then
            exit 1
          fi
          docker commit panel-ci-throwaway panel-ci/committed:1 >/dev/null
          ppanel -o json image remove panel-ci/committed:1 --yes \
            | python3 -c "import json, sys; r = json.load(sys.stdin); assert r['untagged'] == ['panel-ci/committed:1'] and r['deleted'], r"
          ppanel image list
          # Networks and volumes, with what uses them: the installation runs on
          # the host's network and keeps its data in its own volumes.
          ppanel -o json network list \
            | python3 -c "import json, sys; nets = {n['name']: n for n in json.load(sys.stdin)['networks']}; assert nets['host']['containers'] >= 1 and 'bridge' in nets, nets"
          ppanel -o json volume list \
            | python3 -c "import json, sys; vols = [v for v in json.load(sys.stdin)['volumes'] if v['compose_project'] == 'pingora-panel']; assert vols and any(v['containers'] >= 1 for v in vols), vols"
          ppanel network list
          ppanel volume list
          # The disk the engine takes, as docker system df reports it.
          ppanel -o json container engine df docker \
            | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['images']['total'] >= 1 and d['images']['size_bytes'] > 0 and d['volumes']['active'] >= 1, d"
          ppanel container engine df docker
          ppanel container kill panel-ci-throwaway --yes
          test "$(status)" = exited
          ppanel container remove panel-ci-throwaway --yes
          if docker inspect panel-ci-throwaway >/dev/null 2>&1; then
            exit 1
          fi
          # Pruning lists a container that never ran and nothing the
          # installation made, then removes what it listed.
          docker create --name panel-ci-prunable "$nats_image" >/dev/null
          ppanel -o json container engine prune docker \
            | python3 -c "import json, sys; names = [i['name'] for i in json.load(sys.stdin)['items']]; assert 'panel-ci-prunable' in names and not any(n.startswith('pingora-panel') for n in names), names"
          ppanel container engine prune docker --yes
          if docker inspect panel-ci-prunable >/dev/null 2>&1; then
            exit 1
          fi
          # The installation's own containers are only ever started.
          if ppanel container stop pingora-panel-control-1 --yes; then
            exit 1
          fi
          test "$(docker inspect --format '{{.State.Status}}' pingora-panel-control-1)" = running
          for type in container.engine.disabled container.engine.enabled container.stopped \
            container.killed container.removed container.image.removed \
            container.engine.pruned container.operation.refused; do
            for _ in $(seq 1 30); do
              if ppanel -o json audit list --type "$type" --actor-id ci \
                | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"; then
                break
              fi
              sleep 1
            done
            ppanel -o json audit list --type "$type" --actor-id ci \
              | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"
          done

      - name: Manage Compose projects through the host agent
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          # The installation is a project of its own, only ever brought up.
          ppanel -o json compose list \
            | python3 -c "import json, sys; p = {p['name']: p for p in json.load(sys.stdin)['projects']}['pingora-panel']; assert p['installation'] and p['running'] >= 1 and 'control' in [s['name'] for s in p['services']], p"
          if ppanel compose down pingora-panel --yes; then
            exit 1
          fi
          if ppanel compose restart pingora-panel --yes; then
            exit 1
          fi
          ppanel compose up pingora-panel
          test "$(docker inspect --format '{{.State.Status}}' pingora-panel-control-1)" = running
          # Its Compose files are in the runner's home, which the agent's
          # sandbox hides, so each says why it is not read.
          ppanel -o json compose config pingora-panel \
            | python3 -c "import json, sys; files = json.load(sys.stdin)['files']; assert files and all(f['content'] is None and f['error'] for f in files), files"
          # A throwaway project from an image the installation already has, in
          # a directory the agent may read.
          nats_image="$(docker compose config --images | grep '/nats:')"
          sudo install -d -m 0755 /srv/panel-ci-shop
          printf 'services:\n  queue:\n    image: %s\n' "$nats_image" \
            | sudo tee /srv/panel-ci-shop/compose.yaml >/dev/null
          docker compose --project-directory /srv/panel-ci-shop \
            --file /srv/panel-ci-shop/compose.yaml --project-name panel-ci-shop up --detach --wait
          ppanel -o json compose list \
            | python3 -c "import json, sys; p = {p['name']: p for p in json.load(sys.stdin)['projects']}['panel-ci-shop']; assert not p['installation'] and p['running'] == 1 and p['working_directory'] == '/srv/panel-ci-shop', p"
          ppanel compose list
          ppanel -o json compose config panel-ci-shop \
            | python3 -c "import json, sys; files = json.load(sys.stdin)['files']; assert files[0]['path'] == '/srv/panel-ci-shop/compose.yaml' and 'queue:' in files[0]['content'], files"
          ppanel compose config panel-ci-shop
          ppanel -o json compose logs panel-ci-shop --lines 50 \
            | python3 -c "import json, sys; lines = json.load(sys.stdin)['lines']; assert any(l['service'] == 'queue' and 'Server is ready' in l['line']['text'] for l in lines), lines"
          ppanel compose logs panel-ci-shop --lines 5
          status() { docker inspect --format '{{.State.Status}}' panel-ci-shop-queue-1; }
          ppanel compose restart panel-ci-shop --yes
          test "$(status)" = running
          docker stop panel-ci-shop-queue-1 >/dev/null
          ppanel -o json compose up panel-ci-shop \
            | python3 -c "import json, sys; c = json.load(sys.stdin); assert c['changed'] == 1 and c['project']['running'] == 1 and not c['failures'], c"
          test "$(status)" = running
          # Down removes its containers and networks.
          ppanel -o json compose down panel-ci-shop --yes \
            | python3 -c "import json, sys; c = json.load(sys.stdin); assert c['project'] is None and c['changed'] == 1 and not c['failures'], c"
          if docker inspect panel-ci-shop-queue-1 >/dev/null 2>&1; then
            exit 1
          fi
          if docker network inspect panel-ci-shop_default >/dev/null 2>&1; then
            exit 1
          fi
          for type in container.compose.up container.compose.restarted container.compose.down; do
            for _ in $(seq 1 30); do
              if ppanel -o json audit list --type "$type" --actor-id ci \
                | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"; then
                break
              fi
              sleep 1
            done
            ppanel -o json audit list --type "$type" --actor-id ci \
              | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"
          done
          ppanel -o json audit list --type container.operation.refused --actor-id ci \
            | python3 -c "import json, sys; ops = {i['data'].get('operation') for i in json.load(sys.stdin)['items'] if i['data'].get('project') == 'pingora-panel'}; assert {'compose.down', 'compose.restart'} <= ops, ops"

      - name: Pull images through the host agent
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          # A small image from a registry other than Docker Hub, whose
          # anonymous pulls the installation already leans on.
          image=gcr.io/distroless/static-debian12:nonroot
          ppanel image pull "$image" > pulled.out 2> pulled.err
          cat pulled.err
          test "$(cat pulled.out)" = "$image"
          grep -Eq ': (Pull complete|Already exists)$' pulled.err
          grep -q '^Status: ' pulled.err
          docker image inspect "$image" >/dev/null
          # Pulling it again finds it up to date, as JSON lines.
          ppanel -o json image pull "$image" > pulled.jsonl
          tail -n 1 pulled.jsonl \
            | python3 -c "import json, sys; m = json.load(sys.stdin); assert m['kind'] == 'pulled' and not m['updated'] and m['image']['id'], m"
          # A reference the registry does not have fails, and says why.
          if ppanel image pull gcr.io/distroless/panel-ci-missing:1 2> missing.err; then
            exit 1
          fi
          cat missing.err
          ppanel image remove "$image" --yes
          # Each pull is recorded once it ends, refused or not.
          recorded() {
            ppanel -o json audit list --type container.image.pulled --actor-id ci \
              | python3 -c "import json, sys; refs = [i['data'].get('reference') for i in json.load(sys.stdin)['items']]; assert refs.count('$image') == 2, refs" \
              && ppanel -o json audit list --type container.operation.refused --actor-id ci \
              | python3 -c "import json, sys; refused = [i['data'].get('image') for i in json.load(sys.stdin)['items'] if i['data'].get('operation') == 'image.pull']; assert refused == ['gcr.io/distroless/panel-ci-missing:1'], refused"
          }
          for _ in $(seq 1 30); do
            if recorded 2>/dev/null; then
              break
            fi
            sleep 1
          done
          recorded

      - name: Serve a site through the gateway with the command line
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          upstream=$(ppanel -o json upstream create --name console --node 127.0.0.1:8080 \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['id'])")
          ppanel listener set edge --address 127.0.0.1:18080
          ppanel site create --name console --domain console.test --proxy "$upstream"
          ppanel config apply --yes
          ppanel gateway status
          auth="Authorization: Bearer $PPANEL_TOKEN"
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --header 'Host: console.test' --header "$auth" \
              http://127.0.0.1:18080/api/v1/gateway/status; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error --header 'Host: console.test' --header "$auth" \
            http://127.0.0.1:18080/api/v1/gateway/status

      - name: Serve a container through a site put in front of it
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          # A container that publishes its HTTP monitoring port on loopback and
          # declares the site it backs.
          docker run --detach --name panel-ci-web --publish 127.0.0.1:18222:8222 \
            --label pingora-panel.site.domains=web.test --label pingora-panel.site.port=8222 \
            "$(docker compose config --images | grep '/nats:')" -m 8222 >/dev/null
          ppanel -o json container list --search panel-ci-web \
            | python3 -c "import json, sys; c = json.load(sys.stdin)['containers'][0]; e = c['endpoints'][0]; assert (e['host'], e['port'], e['route']) == ('127.0.0.1', 18222, 'published') and c['declared_site']['domains'] == ['web.test'], c"
          ppanel container proxy panel-ci-web
          ppanel -o json container links \
            | python3 -c "import json, sys; links = [l for l in json.load(sys.stdin)['links'] if l['container'] == 'panel-ci-web']; assert [(l['site'], l['node'], l['route']) for l in links] == [('panel-ci-web', '127.0.0.1:18222', 'published')], links"
          ppanel container links
          ppanel config apply --yes
          for _ in $(seq 1 30); do
            if curl --fail --silent --output /dev/null --header 'Host: web.test' \
              http://127.0.0.1:18080/varz; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error --header 'Host: web.test' http://127.0.0.1:18080/varz \
            | python3 -c "import json, sys; assert json.load(sys.stdin)['server_id']"
          # The name is taken now, so a second site is refused and nothing changes.
          if ppanel container proxy panel-ci-web; then
            exit 1
          fi
          docker rm --force panel-ci-web >/dev/null

      - name: Serve a static site from files the panel writes
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          sha=$(printf '<h1>From the panel</h1>\n' \
            | ppanel -o json files put - ci-static/index.html --new \
            | python3 -c "import json, sys; w = json.load(sys.stdin); assert w['created'], w; print(w['sha256'])")
          ppanel files ls ci-static
          test "$(ppanel files cat ci-static/index.html)" = '<h1>From the panel</h1>'
          ppanel site create --name ci-static --domain static.test --static ci-static
          ppanel config apply --yes
          served() { curl --fail --silent --show-error --header 'Host: static.test' http://127.0.0.1:18080/; }
          for _ in $(seq 1 30); do
            if served 2>/dev/null | grep -q 'From the panel'; then
              break
            fi
            sleep 1
          done
          served | grep -q 'From the panel'
          # A write is served at once, with no draft to apply, and only over
          # the content it was read with.
          printf '<h1>Changed</h1>\n' | ppanel files put - ci-static/index.html --if-match "\"$sha\""
          served | grep -q 'Changed'
          if printf 'stale\n' | ppanel files put - ci-static/index.html --if-match "\"$sha\""; then
            exit 1
          fi
          served | grep -q 'Changed'
          # Nothing outside the sites' directory is reached.
          if ppanel files cat ../etc/passwd; then
            exit 1
          fi
          ppanel files rm ci-static --recursive --yes
          for type in files.file.written files.entry.removed files.operation.refused; do
            for _ in $(seq 1 30); do
              if ppanel -o json audit list --type "$type" --actor-id ci \
                | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"; then
                break
              fi
              sleep 1
            done
            ppanel -o json audit list --type "$type" --actor-id ci \
              | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"
          done

      - name: Route requests by method, header and client
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          site=$(ppanel -o json site create --name ci-routes --domain routes.test \
            --respond 200 --body stable \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['id'])")
          ppanel route add "$site" --name canary --match prefix:/api --respond 200 --body canary \
            --method GET --header x-canary=1 \
            --condition '{"kind":"not","condition":{"kind":"client","networks":["192.0.2.0/24"]}}'
          # The draft says which route a request takes before it is applied.
          ppanel -o json route test --host routes.test --target /api/items -H 'X-Canary: 1' \
            | python3 -c "import json, sys; r = json.load(sys.stdin); assert r['outcome'] == 'routed' and r['routes'][0]['name'] == 'canary' and r['routes'][0]['matched'], r"
          ppanel -o json route test --host routes.test --target /api/items \
            | python3 -c "import json, sys; r = json.load(sys.stdin); assert not r['routes'][0]['matched'] and 'x-canary' in r['routes'][0]['reason'], r"
          ppanel route test --host routes.test --target /api/items
          ppanel config apply --yes
          served() {
            curl --fail --silent --show-error --header 'Host: routes.test' "$@" \
              http://127.0.0.1:18080/api/items
          }
          for _ in $(seq 1 30); do
            if served --header 'X-Canary: 1' 2>/dev/null | grep -qx canary; then
              break
            fi
            sleep 1
          done
          test "$(served --header 'X-Canary: 1')" = canary
          test "$(served)" = stable
          test "$(served --request POST --header 'X-Canary: 1')" = stable
          ppanel site delete "$site" --permanent
          ppanel config apply --yes

      - name: Change fields, answer CORS and compress with an HTTP policy
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          upstream=$(ppanel -o json upstream list \
            | python3 -c "import json, sys; print(next(u['id'] for u in json.load(sys.stdin) if u['name'] == 'console'))")
          ppanel http-policy set ci-headers --response-set 'X-Frame-Options: DENY' --remove-server \
            --cors-origin https://app.policies.test --cors-method PUT --cors-max-age 600 \
            --compress gzip --compress br --compress-type application/json --compress-min-size 1k
          site=$(ppanel -o json site create --name ci-policies --domain policies.test \
            --proxy "$upstream" --http-policy ci-headers \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['id'])")
          ppanel http-policy list
          ppanel config apply --yes
          fetch() {
            curl --fail --silent --show-error --header 'Host: policies.test' --dump-header - \
              --output /dev/null "$@" http://127.0.0.1:18080/api/v1/openapi.json
          }
          for _ in $(seq 1 30); do
            if fetch 2>/dev/null | grep -qi '^x-frame-options: deny'; then
              break
            fi
            sleep 1
          done
          headers=$(fetch --header 'Accept-Encoding: br, gzip')
          grep -qi '^x-frame-options: deny' <<<"$headers"
          grep -Eqi '^content-encoding: (br|gzip)' <<<"$headers"
          grep -qi '^vary:.*accept-encoding' <<<"$headers"
          if grep -qi '^server:' <<<"$headers"; then
            exit 1
          fi
          # Clients that accept no coding get the response as it is.
          if fetch | grep -qi '^content-encoding:'; then
            exit 1
          fi
          # The gateway answers preflights from allowed origins itself.
          preflight=$(curl --silent --show-error --dump-header - --output /dev/null --request OPTIONS \
            --header 'Host: policies.test' --header 'Origin: https://app.policies.test' \
            --header 'Access-Control-Request-Method: PUT' http://127.0.0.1:18080/api/v1/openapi.json)
          grep -q '^HTTP/1.1 204' <<<"$preflight"
          grep -qi '^access-control-allow-origin: https://app.policies.test' <<<"$preflight"
          grep -qi '^access-control-allow-methods:.*PUT' <<<"$preflight"
          grep -qi '^access-control-max-age: 600' <<<"$preflight"
          ppanel site delete "$site" --permanent
          ppanel http-policy delete ci-headers
          ppanel config apply --yes

      - name: Rewrite paths and redirect internally
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          upstream=$(ppanel -o json upstream list \
            | python3 -c "import json, sys; print(next(u['id'] for u in json.load(sys.stdin) if u['name'] == 'console'))")
          site=$(ppanel -o json site create --name ci-rewrites --domain rewrites.test \
            --respond 200 --body site --rewrite "rewrite ^/old/(.*)\$ /api/v1/\$1 permanent" \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['id'])")
          ppanel route add "$site" --name docs --match prefix:/docs --proxy "$upstream" \
            --rewrite 'set_uri /api/v1/openapi.json'
          ppanel route add "$site" --name hidden --match prefix:/hidden --respond 204 --internal
          ppanel route add "$site" --name via --match prefix:/via --internal-redirect /hidden
          ppanel config apply --yes
          status() {
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --header 'Host: rewrites.test' "http://127.0.0.1:18080$1"
          }
          for _ in $(seq 1 30); do
            if [ "$(status /hidden)" = 404 ]; then
              break
            fi
            sleep 1
          done
          # An internal route answers only requests sent to it from inside.
          test "$(status /hidden)" = 404
          test "$(status /via)" = 204
          curl --fail --silent --show-error --header 'Host: rewrites.test' \
            http://127.0.0.1:18080/docs \
            | python3 -c "import json, sys; assert 'openapi' in json.load(sys.stdin)"
          moved=$(curl --silent --show-error --dump-header - --output /dev/null \
            --header 'Host: rewrites.test' http://127.0.0.1:18080/old/openapi.json)
          grep -q '^HTTP/1.1 301' <<<"$moved"
          grep -qi '^location: /api/v1/openapi.json' <<<"$moved"
          ppanel site delete "$site" --permanent
          ppanel config apply --yes

      - name: Answer errors with pages and keep a site in maintenance
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          site=$(ppanel -o json site create --name ci-pages --domain pages.test \
            --respond 200 --body open \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['id'])")
          ppanel route add "$site" --name gone --match prefix:/gone --respond 404
          ppanel route add "$site" --name soon --match prefix:/soon --respond 503 --retry-after 30
          ppanel site error-pages "$site" --page '404 "body=<h1>No such page</h1>"' \
            --page '503 "body=Back soon"'
          ppanel site robots "$site" disallow-all
          ppanel site favicon "$site" no-content
          ppanel config apply --yes
          fetch() {
            curl --silent --show-error --header 'Host: pages.test' "http://127.0.0.1:18080$1"
          }
          status() {
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --header 'Host: pages.test' "http://127.0.0.1:18080$1"
          }
          for _ in $(seq 1 30); do
            if [ "$(status /favicon.ico)" = 204 ]; then
              break
            fi
            sleep 1
          done
          test "$(status /favicon.ico)" = 204
          fetch /robots.txt | grep -qx 'Disallow: /'
          # A fixed response without a body gets the page for its status.
          test "$(fetch /gone)" = '<h1>No such page</h1>'
          soon=$(curl --silent --show-error --dump-header - \
            --header 'Host: pages.test' http://127.0.0.1:18080/soon)
          grep -q '^HTTP/1.1 503' <<<"$soon"
          grep -qi '^retry-after: 30' <<<"$soon"
          grep -q 'Back soon' <<<"$soon"
          # This host is not in the allowlist, so it gets the maintenance response.
          ppanel site maintenance "$site" on --allow 192.0.2.0/24 --retry-after 120
          ppanel config apply --yes
          for _ in $(seq 1 30); do
            if [ "$(status /)" = 503 ]; then
              break
            fi
            sleep 1
          done
          closed=$(curl --silent --show-error --dump-header - \
            --header 'Host: pages.test' http://127.0.0.1:18080/)
          grep -q '^HTTP/1.1 503' <<<"$closed"
          grep -qi '^retry-after: 120' <<<"$closed"
          grep -q 'Back soon' <<<"$closed"
          ppanel site maintenance "$site" off
          ppanel config apply --yes
          for _ in $(seq 1 30); do
            if [ "$(status /)" = 200 ]; then
              break
            fi
            sleep 1
          done
          test "$(fetch /)" = open
          ppanel site delete "$site" --permanent
          ppanel config apply --yes

      - name: List directories, map media types and set cache headers on static files
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          printf 'a{}\n' | ppanel files put - ci-listing/assets/app.css --new
          printf 'wasm\n' | ppanel files put - ci-listing/app.wasm --new
          site=$(ppanel -o json site create --name ci-listing --domain listing.test \
            --static ci-listing --autoindex json --media-type wasm=application/wasm \
            --cache-control 'max_age=1y immutable for=css' \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['id'])")
          ppanel config apply --yes
          listed() {
            curl --fail --silent --show-error --header 'Host: listing.test' http://127.0.0.1:18080/
          }
          headers() {
            curl --silent --show-error --dump-header - --output /dev/null \
              --header 'Host: listing.test' "http://127.0.0.1:18080$1"
          }
          for _ in $(seq 1 30); do
            if listed >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          # Directories come first, each group by name.
          listed | python3 -c "import json, sys; names = [e['name'] for e in json.load(sys.stdin)]; assert names == ['assets', 'app.wasm'], names"
          headers /assets/app.css | grep -qi '^cache-control: max-age=31536000, immutable'
          headers /app.wasm | grep -qi '^content-type: application/wasm'
          ppanel site delete "$site" --permanent
          ppanel files rm ci-listing --recursive --yes
          ppanel config apply --yes

      - name: Cache proxied responses, show their Cache-Status and purge them
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          upstream=$(ppanel -o json upstream list \
            | python3 -c "import json, sys; print(next(u['id'] for u in json.load(sys.stdin) if u['name'] == 'console'))")
          ppanel cache-policy set ci-pages --ttl 1m --ignore-origin --bypass-header x-no-cache
          ppanel cache store --max-size 64m
          site=$(ppanel -o json site create --name ci-cache --domain cache.test \
            --proxy "$upstream" --cache-policy ci-pages \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['id'])")
          ppanel route add "$site" --name live --match prefix:/api/v1/gateway --proxy "$upstream" \
            --no-cache
          ppanel cache-policy list
          ppanel config apply --yes
          status() {
            curl --fail --silent --show-error --dump-header - --output /dev/null \
              --header 'Host: cache.test' "$@" http://127.0.0.1:18080/api/v1/openapi.json \
              | tr -d '\r' | sed -n 's/^cache-status: //Ip'
          }
          for _ in $(seq 1 30); do
            if [ -n "$(status 2>/dev/null)" ]; then
              break
            fi
            sleep 1
          done
          # RFC 9211: the first answer was fetched and stored, the next comes
          # from the cache, and a bypassing request goes upstream.
          test "$(status)" = 'pingora-panel; hit'
          test "$(status --header 'x-no-cache: 1')" = 'pingora-panel; fwd=bypass'
          ppanel cache stats
          ppanel -o json cache stats | SITE="$site" python3 -c "import json, os, sys; site = next(s for s in json.load(sys.stdin)['sites'] if s['site_id'] == os.environ['SITE']); assert site['hits'] >= 1 and site['bypasses'] >= 1, site"
          ppanel cache purge --url http://cache.test/api/v1/openapi.json
          test "$(status)" = 'pingora-panel; fwd=miss; stored'
          ppanel cache purge --site "$site"
          test "$(status)" = 'pingora-panel; fwd=miss; stored'
          ppanel cache purge --all
          # The route stays out of the site's cache.
          live=$(curl --silent --show-error --dump-header - --output /dev/null \
            --header 'Host: cache.test' --header "Authorization: Bearer $PPANEL_TOKEN" \
            http://127.0.0.1:18080/api/v1/gateway/status)
          if grep -qi '^cache-status' <<<"$live"; then
            exit 1
          fi
          ppanel -o json audit list --type gateway.cache.purged --actor-id ci \
            | python3 -c "import json, sys; assert len(json.load(sys.stdin)['items']) >= 3"
          ppanel site delete "$site" --permanent
          ppanel cache-policy delete ci-pages
          ppanel cache store --default
          ppanel config apply --yes

      - name: Move the configuration between installations as a bundle
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          ppanel config export --bundle - > configuration.json
          python3 - <<'PY'
          import json
          bundle = json.load(open("configuration.json"))
          assert bundle["format"] == "pingora-panel-configuration", bundle
          assert "main.conf" in bundle["files"], sorted(bundle["files"])
          bundle["files"]["main.conf"] += "# Moved as a bundle\n"
          json.dump(bundle, open("changed.json", "w"))
          bundle["language_version"] += 1
          json.dump(bundle, open("newer.json", "w"))
          PY
          version=$(ppanel -o json config draft | python3 -c "import json, sys; print(json.load(sys.stdin)['version'])")
          ppanel config import - --expected-version "$version" < changed.json
          ppanel config export --bundle - | grep -q 'Moved as a bundle'
          # A bundle written in a newer language version changes nothing.
          if ppanel config import - < newer.json; then
            exit 1
          fi
          ppanel config import - < configuration.json
          ppanel config export --bundle - \
            | python3 -c "import json, sys; assert json.load(sys.stdin) == json.load(open('configuration.json'))"
          rm configuration.json changed.json newer.json

      - name: Serve the site over HTTPS with a certificate the panel keeps
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          ppanel certificate generate console --name console.test --days 30
          ppanel tls-profile set console --certificate-id console
          ppanel listener set edge-tls --address 127.0.0.1:18443 --tls-profile console
          ppanel config apply --yes
          auth="Authorization: Bearer $PPANEL_TOKEN"
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --insecure --header "$auth" \
              --resolve console.test:18443:127.0.0.1 https://console.test:18443/api/v1/gateway/status; then
              break
            fi
            sleep 1
          done
          served=$(openssl s_client -connect 127.0.0.1:18443 -servername console.test </dev/null 2>/dev/null \
            | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')
          kept=$(ppanel -o json certificate show console \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['fingerprint'])")
          test "$served" = "$kept"

      - name: Keep the gateway's metrics in Prometheus
        run: |
          curl --fail --silent --show-error http://127.0.0.1:9185/metrics \
            | grep -q '^pingora_panel_gateway_config_revision '
          requests=0
          for _ in $(seq 1 45); do
            requests=$(curl --fail --silent --show-error --get http://127.0.0.1:9090/api/v1/query \
              --data-urlencode 'query=sum(http_server_request_duration_seconds_count{site!=""})' \
              | python3 -c "import json, sys; r = json.load(sys.stdin)['data']['result']; print(int(float(r[0]['value'][1])) if r else 0)")
            if [ "$requests" -gt 0 ]; then
              break
            fi
            sleep 2
          done
          test "$requests" -gt 0

      - name: Keep the gateway's logs in Loki
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3100/ready; then
              break
            fi
            sleep 2
          done
          records=0
          for _ in $(seq 1 45); do
            records=$(curl --silent --get http://127.0.0.1:3100/loki/api/v1/query_range \
              --data-urlencode 'query={service_name="pingora-panel-gateway"} | pingora_panel_site_id != ""' \
              --data-urlencode "start=$(( $(date +%s) - 3600 ))000000000" \
              | python3 -c "import json, sys; r = json.load(sys.stdin).get('data', {}).get('result', []); print(sum(len(s['values']) for s in r))" \
              || echo 0)
            if [ "$records" -gt 0 ]; then
              break
            fi
            sleep 2
          done
          test "$records" -gt 0

      - name: Audit the changes
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          for _ in $(seq 1 30); do
            if ppanel -o json audit list --type config.draft.applied --actor-id ci \
              | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"; then
              break
            fi
            sleep 1
          done
          ppanel -o json audit list --type config.draft.applied --actor-id ci \
            | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"
          ppanel audit list --actor-id ci
          ppanel -o json audit list --type identity.login.succeeded --actor-id ci \
            | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"
          for _ in $(seq 1 30); do
            if ppanel -o json audit list --type tls.certificate.created --actor-id ci \
              | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"; then
              break
            fi
            sleep 1
          done
          ppanel -o json audit list --type tls.certificate.created --actor-id ci \
            | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"
          ppanel audit verify

      - name: Run a signed plugin and use the ports it provides
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          package() {
            docker compose exec -T control pingora-panel-reference-plugin package \
              /var/lib/pingora-panel/plugins "$1"
          }
          audited() {
            for _ in $(seq 1 30); do
              if ppanel -o json audit list --type "$1" --actor-id ci \
                | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"; then
                return 0
              fi
              sleep 1
            done
            return 1
          }
          # A package is found, but nothing it holds runs until its publisher
          # is trusted and it is granted what it asks for.
          key=$(package 1.0.0)
          ppanel -o json plugin discover \
            | python3 -c "import json, sys; p = json.load(sys.stdin)['plugins'][0]; assert p['versions'][0]['problems'], p"
          ppanel plugin key add reference --public-key "$key" --comment "CI publisher"
          ppanel -o json plugin show reference \
            | python3 -c "import json, sys; p = json.load(sys.stdin); assert not p['versions'][0]['problems'] and p['state'] == 'disabled', p"
          ppanel plugin grant reference dns01,secrets,notifications,backups,containers,gateway,secret-references
          printf 's3cret\n' | ppanel plugin secret set token --from -
          ppanel plugin configure reference --set token=vault:token \
            --set 'containers=[{"name": "web", "image": "nginx:1.29"}]'
          ppanel plugin limit reference --concurrency 4
          ppanel plugin enable reference
          ppanel -o json plugin health reference \
            | python3 -c "import json, sys; h = json.load(sys.stdin); assert h['health']['status'] == 'serving', h"
          # Alerts notify through the plugin's notification port.
          ppanel alert channel create chat --plugin reference --plugin-channel '#ops'
          ppanel alert channel test chat
          ppanel alert channel delete chat
          # The plugin's container engine joins the agent's.
          ppanel -o json container list --engine reference.main \
            | python3 -c "import json, sys; c = json.load(sys.stdin)['containers']; assert any('web' in n for x in c for n in x['names']), c"
          # A backup's copy kept by the plugin comes back as a backup.
          id=$(ppanel -o json backup create --with configuration --wait \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['id'])")
          ppanel backup copy "$id" --to reference
          ppanel -o json backup target ls reference \
            | python3 -c "import json, sys; assert any(a['name'] == 'pingora-panel-backup-$id.tar.zst' for a in json.load(sys.stdin))"
          imported=$(ppanel -o json backup target import reference "pingora-panel-backup-$id.tar.zst" \
            | python3 -c "import json, sys; b = json.load(sys.stdin); assert b['state'] == 'completed', b; print(b['id'])")
          ppanel backup target rm reference "pingora-panel-backup-$id.tar.zst" --yes
          ppanel backup rm "$imported" --yes
          ppanel backup rm "$id" --yes
          # Another version, signed by another key, replaces the one that runs
          # and gives way to it again.
          next=$(package 1.1.0)
          ppanel plugin key add reference-next --public-key "$next"
          ppanel plugin upgrade reference 1.1.0
          ppanel -o json plugin health reference \
            | python3 -c "import json, sys; h = json.load(sys.stdin); assert h['health']['version'] == '1.1.0', h"
          ppanel plugin rollback reference
          ppanel -o json plugin health reference \
            | python3 -c "import json, sys; h = json.load(sys.stdin); assert h['health']['version'] == '1.0.0', h"
          for type in plugins.key.trusted plugins.plugin.granted plugins.plugin.configured \
            plugins.plugin.enabled plugins.plugin.upgraded plugins.plugin.rolled_back \
            plugins.secret.sealed backup.archive.copied backup.archive.imported; do
            audited "$type"
          done
          ppanel plugin disable reference
          ppanel -o json plugin list \
            | python3 -c "import json, sys; assert json.load(sys.stdin)['plugins'][0]['state'] == 'disabled'"

      - name: Back up the installation and restore from the backups
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          taken() {
            ppanel -o json backup create --with "$1" --wait \
              | python3 -c "import json, sys; b = json.load(sys.stdin); assert b['state'] == 'completed', b; print(b['id'])"
          }
          printf '<h1>Kept</h1>\n' | ppanel files put - ci-backup/index.html
          id=$(taken configuration,certificates,sites)
          ppanel backup list
          # The archive arrives intact, its manifest first, holding what was asked.
          ppanel backup download "$id" --to - > backup.tar.zst
          zstd --decompress --stdout backup.tar.zst | tar --list --file - > members
          test "$(head -n 1 members)" = manifest.json
          for member in databases/config.db databases/automation.db configuration/active.json \
            configuration/draft.json sites/ci-backup/index.html; do
            grep -qx "$member" members
          done
          # A site's directory comes back as it was, and the configuration as
          # the draft.
          printf '<h1>Changed</h1>\n' | ppanel files put - ci-backup/index.html
          ppanel backup restore "$id" --sites ci-backup
          test "$(ppanel files cat ci-backup/index.html)" = '<h1>Kept</h1>'
          ppanel -o json backup restore "$id" --configuration \
            | python3 -c "import json, sys; assert json.load(sys.stdin)['draft_version'] > 0"
          for type in backup.archive.requested backup.sites.restored backup.configuration.restored; do
            for _ in $(seq 1 30); do
              if ppanel -o json audit list --type "$type" --actor-id ci \
                | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"; then
                break
              fi
              sleep 1
            done
            ppanel -o json audit list --type "$type" --actor-id ci \
              | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"
          done
          ppanel backup rm "$id" --yes
          ppanel files rm ci-backup --recursive --yes
          # Every database comes back with the control plane stopped, and the
          # control plane starts on them with its audit chain whole.
          databases=$(taken databases)
          docker compose stop control
          docker compose run --rm --no-deps control /usr/local/bin/panel-control restore \
            "/var/lib/pingora-panel/control/backups/$databases.tar.zst"
          docker compose up --detach --wait control
          ppanel config draft
          ppanel audit verify
          rm backup.tar.zst members

      - name: Show service logs
        if: failure()
        run: |
          docker compose logs --no-color
          sudo journalctl --no-pager --unit 'pingora-panel-ops-agent*' \
            || echo "The host agent's units were not installed."

      - name: Remove the installation
        if: always()
        run: docker compose down --volumes
