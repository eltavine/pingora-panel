name: panel-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "panel/**"
      - ".dockerignore"
      - ".github/workflows/panel-deploy.yml"
  pull_request:
    paths:
      - "panel/deploy/**"
      - ".dockerignore"
      - ".github/workflows/panel-deploy.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Build the image and run the Compose installation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSE_FILE: panel/deploy/compose.yaml:panel/deploy/compose.ops-agent.yaml
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Generate installation secrets
        run: panel/deploy/generate-secrets.sh

      - name: Validate the Compose file
        run: docker compose config --quiet

      - name: Build the image
        run: docker compose build

      - name: Install the host agent
        run: |
          sudo env PINGORA_PANEL_IMAGE=localhost/pingora-panel:dev \
            panel/deploy/ops-agent/install.sh directories listeners containers
          sudo systemd-analyze verify \
            /etc/systemd/system/pingora-panel-ops-agent.service \
            /etc/systemd/system/pingora-panel-ops-agent-credentials.service \
            /etc/systemd/system/pingora-panel-ops-agent-credentials.path

      - name: Start the installation
        run: docker compose up --detach

      - name: Wait for every control-plane module to become ready
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error "http://127.0.0.1:9180/readyz" >/dev/null; then
              break
            fi
            sleep 5
          done
          for port in 9180 9181 9182 9183 9184; do
            curl --fail --silent --show-error "http://127.0.0.1:${port}/readyz" >/dev/null
          done

      - name: Create the first account and an API token
        run: |
          password=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | cut -c1-32)
          echo "::add-mask::$password"
          printf '%s\n' "$password" | docker compose exec -T control ppanel setup \
            --username ci --bootstrap-token-file /run/secrets/bootstrap-token --password-stdin
          session=$(curl --fail --silent --show-error --header 'content-type: application/json' \
            --data "{\"username\": \"ci\", \"password\": \"$password\", \"transport\": \"bearer\"}" \
            http://127.0.0.1:8080/api/v1/session \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['secret'])")
          echo "::add-mask::$session"
          token=$(docker compose exec -T -e PPANEL_TOKEN="$session" control ppanel -o json \
            token create ci --days 1 \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['secret'])")
          echo "::add-mask::$token"
          echo "PPANEL_TOKEN=$token" >> "$GITHUB_ENV"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8080/api/v1/gateway/status)" -eq 401

      - name: Check publication and discovery through the API
        run: |
          auth="Authorization: Bearer $PPANEL_TOKEN"
          curl --fail --silent --show-error --header "$auth" http://127.0.0.1:8080/api/v1/gateway/status
          services=$(curl --fail --silent --show-error --header "$auth" \
            http://127.0.0.1:8080/api/v1/platform/services \
            | python3 -c "import json, sys; print(len(json.load(sys.stdin)['services']))")
          test "$services" -eq 5
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/

      - name: Reach the host agent through the API
        run: |
          auth="Authorization: Bearer $PPANEL_TOKEN"
          agent() {
            curl --fail --silent --show-error --header "$auth" http://127.0.0.1:8080/api/v1/host/agent \
              | python3 -c "import json, sys; print(json.load(sys.stdin)['status'])"
          }
          for _ in $(seq 1 30); do
            if [ "$(agent)" = connected ]; then
              break
            fi
            sleep 2
          done
          test "$(agent)" = connected
          curl --fail --silent --show-error --header "$auth" \
            http://127.0.0.1:8080/api/v1/host/directories \
            | python3 -c "import json, sys; found = json.load(sys.stdin)['directories']; assert len(found) == 3 and all(d['present'] for d in found), found"
          curl --fail --silent --show-error --header "$auth" \
            'http://127.0.0.1:8080/api/v1/host/listeners?ports=8080' \
            | python3 -c "import json, sys; found = json.load(sys.stdin)['listeners']; assert any(p['name'] == 'panel-control' for l in found for p in l['processes']), found"
          docker compose exec -T -e PPANEL_TOKEN control ppanel host agent
          docker compose exec -T -e PPANEL_TOKEN control ppanel host directories
          docker compose exec -T -e PPANEL_TOKEN control ppanel host listeners --port 8080
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          state() {
            ppanel -o json host gateway-service \
              | python3 -c "import json, sys; print(json.load(sys.stdin)['container']['state'])"
          }
          gateway_ready() {
            for _ in $(seq 1 30); do
              if curl --fail --silent --output /dev/null http://127.0.0.1:9185/readyz; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          ppanel host gateway-service
          test "$(state)" = running
          ppanel --timeout 120 host gateway-service restart --yes
          test "$(state)" = running
          gateway_ready
          ppanel --timeout 120 host gateway-service stop --yes
          test "$(state)" = exited
          # The gateway itself is down, not just reported so.
          if curl --silent --output /dev/null --max-time 2 http://127.0.0.1:9185/livez; then
            exit 1
          fi
          ppanel --timeout 120 host gateway-service start
          test "$(state)" = running
          gateway_ready
          for _ in $(seq 1 30); do
            if ppanel -o json audit list --type host.gateway_service.restarted --actor-id ci \
              | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"; then
              break
            fi
            sleep 1
          done
          ppanel -o json audit list --type host.gateway_service.restarted --actor-id ci \
            | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"

      - name: Reach the containers through the host agent
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          engines() {
            ppanel -o json container engines \
              | python3 -c "import json, sys; print(' '.join(f\"{e['id']}:{e['enabled']}:{e['reachable']}\" for e in json.load(sys.stdin)['engines']))"
          }
          test "$(engines)" = docker:True:True
          ppanel container engine disable docker
          test "$(engines)" = docker:False:True
          # The choice outlives the agent.
          sudo systemctl restart pingora-panel-ops-agent.service
          for _ in $(seq 1 30); do
            if [ "$(engines 2>/dev/null)" = docker:False:True ]; then
              break
            fi
            sleep 2
          done
          test "$(engines)" = docker:False:True
          ppanel container engine enable docker
          ppanel container engines
          ppanel -o json container list --state running \
            | python3 -c "import json, sys; found = json.load(sys.stdin)['containers']; assert any(c['compose_project'] == 'pingora-panel' for c in found), found"
          ppanel container list --search pingora-panel-control
          # A throwaway container from an image the installation already has.
          docker run --detach --name panel-ci-throwaway \
            "$(docker compose config --images | grep '/nats:')" >/dev/null
          status() { docker inspect --format '{{.State.Status}}' panel-ci-throwaway; }
          ppanel container stop panel-ci-throwaway --yes
          test "$(status)" = exited
          ppanel container start panel-ci-throwaway
          test "$(status)" = running
          ppanel container restart panel-ci-throwaway --yes
          test "$(status)" = running
          ppanel -o json container inspect panel-ci-throwaway \
            | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['container']['names'] == ['panel-ci-throwaway'] and d['started_at'], d"
          ppanel -o json container inspect pingora-panel-control-1 \
            | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['container']['labels']['com.docker.compose.service'] == 'control', d"
          # What it printed, then what it prints until it stops.
          ppanel -o json container logs panel-ci-throwaway --lines 50 \
            | python3 -c "import json, sys; lines = json.load(sys.stdin)['lines']; assert any('Server is ready' in line['text'] for line in lines), lines"
          timeout 60 docker compose exec -T -e PPANEL_TOKEN control \
            ppanel -o json container logs panel-ci-throwaway --follow --lines 1 > followed.jsonl &
          follower=$!
          for _ in $(seq 1 30); do
            if [ -s followed.jsonl ]; then
              break
            fi
            sleep 1
          done
          docker stop panel-ci-throwaway >/dev/null
          wait "$follower"
          test "$(wc -l < followed.jsonl)" -ge 2
          ppanel container start panel-ci-throwaway
          test "$(status)" = running
          # What it uses, alone and among every running container.
          ppanel -o json container stats panel-ci-throwaway \
            | python3 -c "import json, sys; s = json.load(sys.stdin); assert s['name'] == 'panel-ci-throwaway' and s['pids'] >= 1 and s['memory_bytes'] > 0 and s['read_at'], s"
          ppanel -o json container stats \
            | python3 -c "import json, sys; names = [s['name'] for s in json.load(sys.stdin)['stats']]; assert {'panel-ci-throwaway', 'pingora-panel-control-1'} <= set(names), names"
          ppanel container stats
          ppanel container kill panel-ci-throwaway --yes
          test "$(status)" = exited
          ppanel container remove panel-ci-throwaway --yes
          if docker inspect panel-ci-throwaway >/dev/null 2>&1; then
            exit 1
          fi
          # The installation's own containers are only ever started.
          if ppanel container stop pingora-panel-control-1 --yes; then
            exit 1
          fi
          test "$(docker inspect --format '{{.State.Status}}' pingora-panel-control-1)" = running
          for type in container.engine.disabled container.engine.enabled container.stopped \
            container.killed container.removed container.operation.refused; do
            for _ in $(seq 1 30); do
              if ppanel -o json audit list --type "$type" --actor-id ci \
                | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"; then
                break
              fi
              sleep 1
            done
            ppanel -o json audit list --type "$type" --actor-id ci \
              | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"
          done

      - name: Serve a site through the gateway with the command line
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          upstream=$(ppanel -o json upstream create --name console --node 127.0.0.1:8080 \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['id'])")
          ppanel listener set edge --address 127.0.0.1:18080
          ppanel site create --name console --domain console.test --proxy "$upstream"
          ppanel config apply
          ppanel gateway status
          auth="Authorization: Bearer $PPANEL_TOKEN"
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --header 'Host: console.test' --header "$auth" \
              http://127.0.0.1:18080/api/v1/gateway/status; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error --header 'Host: console.test' --header "$auth" \
            http://127.0.0.1:18080/api/v1/gateway/status

      - name: Serve the site over HTTPS with a certificate the panel keeps
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          ppanel certificate generate console --name console.test --days 30
          ppanel tls-profile set console --certificate-id console
          ppanel listener set edge-tls --address 127.0.0.1:18443 --tls-profile console
          ppanel config apply
          auth="Authorization: Bearer $PPANEL_TOKEN"
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --insecure --header "$auth" \
              --resolve console.test:18443:127.0.0.1 https://console.test:18443/api/v1/gateway/status; then
              break
            fi
            sleep 1
          done
          served=$(openssl s_client -connect 127.0.0.1:18443 -servername console.test </dev/null 2>/dev/null \
            | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')
          kept=$(ppanel -o json certificate show console \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['fingerprint'])")
          test "$served" = "$kept"

      - name: Keep the gateway's metrics in Prometheus
        run: |
          curl --fail --silent --show-error http://127.0.0.1:9185/metrics \
            | grep -q '^pingora_panel_gateway_config_revision '
          requests=0
          for _ in $(seq 1 45); do
            requests=$(curl --fail --silent --show-error --get http://127.0.0.1:9090/api/v1/query \
              --data-urlencode 'query=sum(http_server_request_duration_seconds_count{site!=""})' \
              | python3 -c "import json, sys; r = json.load(sys.stdin)['data']['result']; print(int(float(r[0]['value'][1])) if r else 0)")
            if [ "$requests" -gt 0 ]; then
              break
            fi
            sleep 2
          done
          test "$requests" -gt 0

      - name: Keep the gateway's logs in Loki
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3100/ready; then
              break
            fi
            sleep 2
          done
          records=0
          for _ in $(seq 1 45); do
            records=$(curl --silent --get http://127.0.0.1:3100/loki/api/v1/query_range \
              --data-urlencode 'query={service_name="pingora-panel-gateway"} | pingora_panel_site_id != ""' \
              --data-urlencode "start=$(( $(date +%s) - 3600 ))000000000" \
              | python3 -c "import json, sys; r = json.load(sys.stdin).get('data', {}).get('result', []); print(sum(len(s['values']) for s in r))" \
              || echo 0)
            if [ "$records" -gt 0 ]; then
              break
            fi
            sleep 2
          done
          test "$records" -gt 0

      - name: Audit the changes
        run: |
          ppanel() { docker compose exec -T -e PPANEL_TOKEN control ppanel "$@"; }
          for _ in $(seq 1 30); do
            if ppanel -o json audit list --type config.draft.applied --actor-id ci \
              | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"; then
              break
            fi
            sleep 1
          done
          ppanel -o json audit list --type config.draft.applied --actor-id ci \
            | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"
          ppanel audit list --actor-id ci
          ppanel -o json audit list --type identity.login.succeeded --actor-id ci \
            | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"
          for _ in $(seq 1 30); do
            if ppanel -o json audit list --type tls.certificate.created --actor-id ci \
              | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"; then
              break
            fi
            sleep 1
          done
          ppanel -o json audit list --type tls.certificate.created --actor-id ci \
            | python3 -c "import json, sys; sys.exit(0 if json.load(sys.stdin)['items'] else 1)"
          ppanel audit verify

      - name: Show service logs
        if: failure()
        run: |
          docker compose logs --no-color
          sudo journalctl --no-pager --unit 'pingora-panel-ops-agent*' \
            || echo "The host agent's units were not installed."

      - name: Remove the installation
        if: always()
        run: docker compose down --volumes
