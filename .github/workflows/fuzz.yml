name: Decoder fuzzing

on:
  schedule:
    - cron: '47 4 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - revision_documents
          - snapshot_records
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: nightly # rust-toolchain-policy: fuzz-canary

      - name: Install cargo-fuzz 0.13.2
        run: cargo install --locked --version 0.13.2 cargo-fuzz

      - name: Run bounded fuzz target
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -print_final_stats=1
