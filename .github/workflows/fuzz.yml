name: Decoder fuzzing

on:
  schedule:
    - cron: '47 4 * * 6'
  workflow_dispatch:
  push:
    paths:
      - "fuzz/**"
      - "panel/Cargo.toml"
      - "panel/panel-config-domain/**"
      - "panel/panel-config-state-codec/**"
      - "panel/panel-domain/**"
      - "panel/panel-engine/**"
      - "panel/panel-errors/**"
      - "panel/panel-ir/**"
      - "panel/snapshot-store-fs/**"
      - ".cargo/**"
      - ".github/workflows/fuzz.yml"
  pull_request:
    paths:
      - "fuzz/**"
      - "panel/Cargo.toml"
      - "panel/panel-config-domain/**"
      - "panel/panel-config-state-codec/**"
      - "panel/panel-domain/**"
      - "panel/panel-engine/**"
      - "panel/panel-errors/**"
      - "panel/panel-ir/**"
      - "panel/snapshot-store-fs/**"
      - ".cargo/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - revision_documents
          - snapshot_records
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: nightly # rust-toolchain-policy: fuzz-canary

      - name: Install cargo-fuzz 0.13.2
        run: cargo install --locked --version 0.13.2 cargo-fuzz

      - name: Check the committed fuzz dependency resolution
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked

      - name: Run bounded fuzz target
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -print_final_stats=1
