name: panel

on:
  workflow_dispatch:
  push:
    paths:
      - ".cargo/config.toml"
      - ".rustfmt.toml"
      - "panel/**"
      - ".github/policies/panel-boundaries.json"
      - ".github/scripts/check-cargo-machete-workspace.sh"
      - ".github/scripts/check-panel-boundaries.sh"
      - ".github/scripts/check-panel-pingora-version.sh"
      - ".github/scripts/check-panel-package-policy.sh"
      - ".github/scripts/check-panel-unsafe-policy.py"
      - ".github/policies/panel-unsafe-adapters.json"
      - ".github/scripts/check-panel-enum-exhaustiveness.py"
      - ".github/policies/panel-exhaustive-enums.json"
      - ".github/scripts/check-panel-workspace-dependencies.py"
      - ".github/scripts/check-panel-proto-breaking.sh"
      - ".github/scripts/check-panel-rust-api-breaking.sh"
      - ".github/scripts/list-workspace-package-names.py"
      - ".github/scripts/resolve-panel-compat-baseline.sh"
      - ".github/scripts/resolve-panel-proto-baseline.sh"
      - ".github/scripts/test-panel-compat-baseline.sh"
      - ".github/scripts/test-panel-boundaries.sh"
      - ".github/scripts/test-panel-pingora-version.sh"
      - ".github/scripts/test-panel-package-policy.sh"
      - ".github/scripts/test-panel-unsafe-policy.py"
      - ".github/scripts/test-panel-enum-exhaustiveness.py"
      - ".github/scripts/test-panel-workspace-dependencies.py"
      - ".github/scripts/test-cargo-machete-workspace.sh"
      - ".github/scripts/test-panel-proto-breaking.sh"
      - ".github/scripts/test-panel-rust-api-breaking.sh"
      - ".github/workflows/panel.yml"
  pull_request:
    paths:
      - ".cargo/config.toml"
      - ".rustfmt.toml"
      - "panel/**"
      - ".github/policies/panel-boundaries.json"
      - ".github/scripts/check-cargo-machete-workspace.sh"
      - ".github/scripts/check-panel-boundaries.sh"
      - ".github/scripts/check-panel-pingora-version.sh"
      - ".github/scripts/check-panel-package-policy.sh"
      - ".github/scripts/check-panel-unsafe-policy.py"
      - ".github/policies/panel-unsafe-adapters.json"
      - ".github/scripts/check-panel-enum-exhaustiveness.py"
      - ".github/policies/panel-exhaustive-enums.json"
      - ".github/scripts/check-panel-workspace-dependencies.py"
      - ".github/scripts/check-panel-proto-breaking.sh"
      - ".github/scripts/check-panel-rust-api-breaking.sh"
      - ".github/scripts/list-workspace-package-names.py"
      - ".github/scripts/resolve-panel-compat-baseline.sh"
      - ".github/scripts/resolve-panel-proto-baseline.sh"
      - ".github/scripts/test-panel-compat-baseline.sh"
      - ".github/scripts/test-panel-boundaries.sh"
      - ".github/scripts/test-panel-pingora-version.sh"
      - ".github/scripts/test-panel-package-policy.sh"
      - ".github/scripts/test-panel-unsafe-policy.py"
      - ".github/scripts/test-panel-enum-exhaustiveness.py"
      - ".github/scripts/test-panel-workspace-dependencies.py"
      - ".github/scripts/test-cargo-machete-workspace.sh"
      - ".github/scripts/test-panel-proto-breaking.sh"
      - ".github/scripts/test-panel-rust-api-breaking.sh"
      - ".github/workflows/panel.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.profile }} / ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: msrv
            toolchain: 1.88.0 # rust-msrv-policy: panel-msrv
          - profile: stable
            toolchain: 1.98.0
          - profile: canary
            toolchain: nightly # rust-toolchain-policy: panel-canary
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake --no-install-recommends

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-30
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path panel/Cargo.toml --all -- --check

      - name: Check workspace
        run: cargo check --manifest-path panel/Cargo.toml --workspace --locked

      - name: Run contract tests
        run: cargo test --manifest-path panel/Cargo.toml --workspace --all-features --locked

      - name: Run Clippy
        env:
          CLIPPY_CONF_DIR: ${{ github.workspace }}/panel
        run: cargo clippy --manifest-path panel/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings

      - name: Compile Pingora adapter
        run: cargo check --manifest-path panel/Cargo.toml --package gateway-pingora --locked

  feature-matrix:
    name: Panel features (${{ matrix.selection }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - selection: default
            arguments: ""
          - selection: no-default
            arguments: "--no-default-features"
          - selection: tls
            arguments: "--no-default-features --features tls"
          - selection: cache
            arguments: "--no-default-features --features cache"
          - selection: lua
            arguments: "--no-default-features --features lua"
          - selection: all
            arguments: "--all-features"
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake --no-install-recommends

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-30
        with:
          toolchain: 1.98.0

      # Feature gates are reserved capability declarations, so the capability
      # contract must execute under every selection rather than merely compile.
      - name: Test the Pingora adapter feature selection
        run: >-
          cargo test
          --manifest-path panel/Cargo.toml
          --package gateway-pingora
          --all-targets
          --locked
          ${{ matrix.arguments }}

  protobuf:
    name: Protobuf contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Self-test compatibility baseline resolution
        run: bash .github/scripts/test-panel-compat-baseline.sh

      - name: Install Buf 1.47.2
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.47.2

      - name: Lint contracts
        working-directory: panel
        run: buf lint

      - name: Check contract formatting
        working-directory: panel
        run: buf format --diff --exit-code

      - name: Self-test Protobuf compatibility guard
        run: bash .github/scripts/test-panel-proto-breaking.sh

      - name: Resolve Protobuf compatibility baseline
        id: proto-baseline
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          baseline_ref="$(bash .github/scripts/resolve-panel-proto-baseline.sh \
            "$EVENT_NAME" "$PUSH_BEFORE" "$PULL_REQUEST_BASE" "$DEFAULT_BRANCH")"
          printf 'ref=%s\n' "$baseline_ref" >> "$GITHUB_OUTPUT"

      - name: Check breaking changes against the previous contract
        env:
          BASELINE_REF: ${{ steps.proto-baseline.outputs.ref }}
        run: bash .github/scripts/check-panel-proto-breaking.sh "$BASELINE_REF"

  rust-api:
    name: Rust public API compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Self-test compatibility baseline resolution
        run: bash .github/scripts/test-panel-compat-baseline.sh

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake --no-install-recommends

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-30
        with:
          toolchain: 1.98.0

      - name: Install cargo-semver-checks 0.50.0
        run: cargo install --locked --version 0.50.0 cargo-semver-checks

      - name: Self-test Rust API compatibility guard
        run: bash .github/scripts/test-panel-rust-api-breaking.sh

      - name: Resolve Rust API compatibility baseline
        id: rust-api-baseline
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          baseline_ref="$(bash .github/scripts/resolve-panel-compat-baseline.sh \
            "$EVENT_NAME" "$PUSH_BEFORE" "$PULL_REQUEST_BASE" "$DEFAULT_BRANCH")"
          printf 'ref=%s\n' "$baseline_ref" >> "$GITHUB_OUTPUT"

      - name: Reject Rust public API breaking changes
        env:
          BASELINE_REF: ${{ steps.rust-api-baseline.outputs.ref }}
        run: bash .github/scripts/check-panel-rust-api-breaking.sh "$BASELINE_REF"

  architecture-contracts:
    name: Architecture contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq --no-install-recommends

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-30
        with:
          toolchain: 1.98.0

      - name: Self-test Panel workspace dependency catalog
        run: python3 .github/scripts/test-panel-workspace-dependencies.py

      - name: Verify Panel workspace dependency catalog
        run: python3 .github/scripts/check-panel-workspace-dependencies.py

      - name: Self-test Panel dependency boundaries
        run: bash .github/scripts/test-panel-boundaries.sh

      - name: Verify Panel dependency boundaries
        run: bash .github/scripts/check-panel-boundaries.sh

      - name: Self-test Pingora version coherence
        run: bash .github/scripts/test-panel-pingora-version.sh

      - name: Verify Pingora version coherence
        run: bash .github/scripts/check-panel-pingora-version.sh

      - name: Self-test Panel package policy
        run: bash .github/scripts/test-panel-package-policy.sh

      - name: Verify Panel packages are private
        run: bash .github/scripts/check-panel-package-policy.sh

      - name: Self-test Panel unsafe isolation policy
        run: python3 .github/scripts/test-panel-unsafe-policy.py

      - name: Verify Panel unsafe isolation policy
        run: python3 .github/scripts/check-panel-unsafe-policy.py

      - name: Self-test public enum exhaustiveness decisions
        run: python3 .github/scripts/test-panel-enum-exhaustiveness.py

      - name: Verify every public enum has an exhaustiveness decision
        run: python3 .github/scripts/check-panel-enum-exhaustiveness.py

  dependency-hygiene:
    name: Dependency hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq --no-install-recommends

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-30
        with:
          toolchain: 1.98.0

      - name: Self-test workspace dependency scanner
        run: bash .github/scripts/test-cargo-machete-workspace.sh

      - name: Install cargo-machete 0.7.0
        run: cargo install --locked --version 0.7.0 cargo-machete

      - name: Reject unused Panel dependencies
        run: bash .github/scripts/check-cargo-machete-workspace.sh panel/Cargo.toml

  snapshot-store-portability:
    name: Snapshot store (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Rust target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-30
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Check snapshot store portability
        run: >-
          cargo check
          --manifest-path panel/Cargo.toml
          --package snapshot-store-fs
          --all-targets
          --locked
          --target ${{ matrix.target }}
