name: panel

on:
  push:
    paths:
      - "panel/**"
      - ".github/scripts/check-panel-boundaries.sh"
      - ".github/workflows/panel.yml"
  pull_request:
    paths:
      - "panel/**"
      - ".github/scripts/check-panel-boundaries.sh"
      - ".github/workflows/panel.yml"

permissions:
  contents: read

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.88.0", stable, nightly]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake jq --no-install-recommends

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path panel/Cargo.toml --all -- --check

      - name: Check workspace
        run: cargo check --manifest-path panel/Cargo.toml --workspace --locked

      - name: Run contract tests
        run: cargo test --manifest-path panel/Cargo.toml --workspace --locked

      - name: Run Clippy
        env:
          CLIPPY_CONF_DIR: ${{ github.workspace }}/panel
        run: cargo clippy --manifest-path panel/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Check dependency boundaries
        run: .github/scripts/check-panel-boundaries.sh

      - name: Compile Pingora adapter
        run: cargo check --manifest-path panel/Cargo.toml --package gateway-pingora --locked

  protobuf:
    name: Protobuf contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Buf 1.47.2
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.47.2

      - name: Lint contracts
        working-directory: panel
        run: buf lint

      - name: Check breaking changes when a baseline exists
        working-directory: panel
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if git cat-file -e "origin/$BASE_REF:panel/proto/common/v1/common.proto" 2>/dev/null; then
            buf breaking --against "https://github.com/$REPOSITORY.git#branch=$BASE_REF,subdir=panel"
          else
            echo "No Proto baseline on $BASE_REF; lint-only bootstrap run."
          fi
