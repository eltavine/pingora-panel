name: build

on:
  workflow_dispatch:
  push:
    paths:
      - ".cargo/**"
      - ".rustfmt.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "pingora*/**"
      - "tinyufo/**"
      - "vendor/aws-sigv4/**"
      - ".github/scripts/check-cargo-machete-workspace.sh"
      - ".github/scripts/resolve-security-lockfile.sh"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - ".cargo/**"
      - ".rustfmt.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "pingora*/**"
      - "tinyufo/**"
      - "vendor/aws-sigv4/**"
      - ".github/scripts/check-cargo-machete-workspace.sh"
      - ".github/scripts/resolve-security-lockfile.sh"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENRESTY_VERSION: 1.27.1.2
  OPENRESTY_SHA256: 74f076f7e364b2a99a6c5f9bb531c27610c78985abe956b442b192a2295f7548

jobs:
  pingora:
    name: Pingora (${{ matrix.profile }} / ${{ matrix.toolchain }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: canary
            toolchain: nightly # rust-toolchain-policy: upstream-canary
            build_openresty: true
            run_tests: true
            run_quality: false
          - profile: msrv
            toolchain: 1.85.0
            build_openresty: false
            run_tests: false
            run_quality: false
          - profile: stable
            toolchain: 1.99.1
            build_openresty: true
            run_tests: true
            run_quality: true
    runs-on: ubuntu-24.04
    # Only run on "pull_request" event for external PRs. This is to avoid
    # duplicate builds for PRs created from internal branches.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: "recursive"

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake libclang-dev ca-certificates curl jq --no-install-recommends

      - name: Cache OpenResty
        if: matrix.build_openresty
        id: cache-openresty
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/openresty
          key: openresty-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENRESTY_VERSION }}-${{ env.OPENRESTY_SHA256 }}-v1

      - name: Build OpenResty
        if: matrix.build_openresty && steps.cache-openresty.outputs.cache-hit != 'true'
        run: |
          sudo apt install -y build-essential libpcre2-dev libssl-dev zlib1g-dev --no-install-recommends

          archive="$RUNNER_TEMP/openresty-$OPENRESTY_VERSION.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            "https://github.com/openresty/openresty/releases/download/v$OPENRESTY_VERSION/openresty-$OPENRESTY_VERSION.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$OPENRESTY_SHA256" "$archive" | sha256sum --check --strict

          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/openresty-$OPENRESTY_VERSION"
          ./configure \
            --prefix="$HOME/.local/openresty" \
            --with-http_ssl_module \
            --with-http_v2_module
          make -j"$(nproc)"
          make install

      - name: Add OpenResty to PATH
        if: matrix.build_openresty
        run: |
          test -x "$HOME/.local/openresty/bin/openresty"
          echo "$HOME/.local/openresty/bin" >> "$GITHUB_PATH"
          "$HOME/.local/openresty/bin/openresty" -V

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo check
        run: |
          if [[ '${{ matrix.profile }}' == 'msrv' ]]; then
            # pingora-foundations follows Foundations' higher MSRV and is covered by the other toolchains in this matrix.
            cargo check --workspace --exclude pingora-foundations
          else
            cargo check --workspace
          fi

      - name: Run cargo test
        if: matrix.run_tests
        run: cargo test --verbose --lib --bins --tests --no-fail-fast

      # Need to run doc tests separately.
      # (https://github.com/rust-lang/cargo/issues/6669)
      - name: Run cargo doc test
        if: matrix.run_tests
        run: cargo test --verbose --doc

      - name: Run cargo clippy
        if: matrix.run_quality
        run: cargo clippy --all-targets --all -- --allow=unknown-lints --deny=warnings

      - name: Run cargo audit
        if: matrix.run_quality
        run: |
          cargo install --locked --version 0.22.2 cargo-audit
          cargo generate-lockfile --ignore-rust-version
          cargo audit

      - name: Run cargo machete
        if: matrix.run_quality
        run: |
          cargo install --locked --version 0.7.0 cargo-machete
          bash .github/scripts/check-cargo-machete-workspace.sh Cargo.toml

  runtime-telemetry:
    name: Pingora optional telemetry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: --cfg tokio_unstable
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libclang-dev libelf-dev pkg-config zlib1g-dev --no-install-recommends
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
      - name: Resolve patched dependencies
        run: bash .github/scripts/resolve-security-lockfile.sh
      - name: Test recorder lifecycle
        run: cargo test -p pingora-runtime --features dial9 --locked
      - name: Test patched S3 signing
        run: |
          cargo generate-lockfile --manifest-path vendor/aws-sigv4/Cargo.toml --ignore-rust-version
          cargo test --manifest-path vendor/aws-sigv4/Cargo.toml --target-dir target --all-features --locked
      - name: Check every telemetry feature and test target
        run: cargo check -p pingora-runtime --all-features --all-targets --locked
