name: panel-web

on:
  workflow_dispatch:
  push:
    paths:
      - "panel/web/**"
      - "panel/panel-api/tests/fixtures/openapi.json"
      - "panel/surfaces.json"
      - "panel/scripts/supply-chain.sh"
      - ".github/scripts/install-syft.sh"
      - ".github/scripts/install-grype.sh"
      - ".github/scripts/check-vulnerability-leases.py"
      - ".github/scripts/test-vulnerability-leases.py"
      - ".github/policies/vulnerability-leases.json"
      - ".github/workflows/panel-web.yml"
  pull_request:
    paths:
      - "panel/web/**"
      - "panel/panel-api/tests/fixtures/openapi.json"
      - "panel/surfaces.json"
      - "panel/scripts/supply-chain.sh"
      - ".github/scripts/install-syft.sh"
      - ".github/scripts/install-grype.sh"
      - ".github/scripts/check-vulnerability-leases.py"
      - ".github/scripts/test-vulnerability-leases.py"
      - ".github/policies/vulnerability-leases.json"
      - ".github/workflows/panel-web.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: panel/web

jobs:
  checks:
    name: Type-check, lint, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: panel/web/package.json

      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: panel/web/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the API client from the reviewed OpenAPI contract
        run: pnpm codegen

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build-only

      - name: Self-test the vulnerability lease guard
        working-directory: .
        run: python3 .github/scripts/test-vulnerability-leases.py

      - name: Install the SBOM and vulnerability tools
        working-directory: .
        run: |
          bash .github/scripts/install-syft.sh "$RUNNER_TEMP/evidence-bin"
          bash .github/scripts/install-grype.sh "$RUNNER_TEMP/evidence-bin"
          printf '%s\n' "$RUNNER_TEMP/evidence-bin" >> "$GITHUB_PATH"

      - name: Describe the console's packages in an SBOM and scan them
        working-directory: .
        run: |
          evidence="$RUNNER_TEMP/evidence"
          mkdir -p "$evidence"
          panel/scripts/supply-chain.sh sbom web "$evidence/web.cdx.json"
          panel/scripts/supply-chain.sh scan "$evidence/web.cdx.json" "$evidence/web.grype.json"
          python3 .github/scripts/check-vulnerability-leases.py --scope web "$evidence/web.grype.json"

      - name: Write the licenses of the console's packages
        run: node scripts/third-party-notices.ts > "$RUNNER_TEMP/evidence/third-party-notices-web.md"

      - name: Keep the console's supply-chain evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error

  e2e:
    name: Playwright (desktop and mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: panel/web/package.json

      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: panel/web/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers matching the locked Playwright release
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: panel/web/playwright-report
          retention-days: 7
