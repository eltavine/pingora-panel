name: panel coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "13 5 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    name: Panel LLVM coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake --no-install-recommends

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: 1.99.0
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov 0.9.0
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.0

      # Keep this as a reporting lane rather than a brittle percentage gate:
      # the summary makes coverage drift visible while the test suite evolves.
      - name: Measure panel coverage
        run: >-
          cargo llvm-cov
          --manifest-path panel/Cargo.toml
          --workspace
          --all-features
          --locked
          --summary-only | tee "$GITHUB_STEP_SUMMARY"
