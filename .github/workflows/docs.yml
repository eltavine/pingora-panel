name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pingora*/**"
      - "tinyufo/**"
      - "panel/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pingora*/**"
      - "tinyufo/**"
      - "panel/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs (${{ matrix.workspace }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: upstream
            manifest: Cargo.toml
            locked: false
            # Root TLS backends are mutually exclusive, so --all-features is not a valid build.
            all-features: false
          - workspace: panel
            manifest: panel/Cargo.toml
            locked: true
            all-features: true
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: "recursive"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev --no-install-recommends

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-30
        with:
          toolchain: 1.98.0

      - name: Build workspace documentation
        run: |
          args=(
            doc
            --manifest-path '${{ matrix.manifest }}'
            --workspace
            --no-deps
          )
          if [[ '${{ matrix.locked }}' == 'true' ]]; then
            args+=(--locked)
          fi
          if [[ '${{ matrix.all-features }}' == 'true' ]]; then
            args+=(--all-features)
          fi
          cargo "${args[@]}"
