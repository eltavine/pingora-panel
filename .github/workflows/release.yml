name: release

# A version tag builds the image for amd64 and arm64, the command line for
# Linux and macOS, and the release's SBOMs and license notices; signs the
# image and every asset without keys and attests their provenance (ADR 0046).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the release
        id: release
        run: printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: panel/deploy/Containerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PINGORA_PANEL_VERSION=${{ steps.release.outputs.version }}
            PINGORA_PANEL_COMMIT=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Keep the platform's digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - name: Upload the platform's digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error

  index:
    name: Image index, signature, SBOMs and attestations
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the release
        id: release
        run: printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download the platforms' digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Join the platforms into one index
        id: index
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY"
          version=${GITHUB_REF_NAME#v}
          docker buildx imagetools create --tag "$image:$version" \
            "$image@$(cat "$RUNNER_TEMP/digests/amd64")" \
            "$image@$(cat "$RUNNER_TEMP/digests/arm64")"
          digest=$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest}}' | jq -r .digest)
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the index without keys
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "ghcr.io/$GITHUB_REPOSITORY@$DIGEST"

      - name: Install Syft and Grype
        run: |
          bash .github/scripts/install-syft.sh "$RUNNER_TEMP/evidence-bin"
          bash .github/scripts/install-grype.sh "$RUNNER_TEMP/evidence-bin"
          printf '%s\n' "$RUNNER_TEMP/evidence-bin" >> "$GITHUB_PATH"

      - name: Describe each platform in an SBOM and scan it
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          version=${GITHUB_REF_NAME#v}
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets" "$RUNNER_TEMP/reports"
          for arch in amd64 arm64; do
            sbom="$assets/pingora-panel-$version-image-linux-$arch.cdx.json"
            SYFT_PLATFORM="linux/$arch" PINGORA_PANEL_VERSION="$version" \
              panel/scripts/supply-chain.sh sbom image "registry:ghcr.io/$GITHUB_REPOSITORY@$DIGEST" "$sbom"
            panel/scripts/supply-chain.sh scan "$sbom" "$RUNNER_TEMP/reports/image-$arch.grype.json"
            python3 .github/scripts/check-vulnerability-leases.py --scope image \
              "$RUNNER_TEMP/reports/image-$arch.grype.json"
          done
          cp "$RUNNER_TEMP/digests/amd64" "$RUNNER_TEMP/amd64.digest"
          cp "$RUNNER_TEMP/digests/arm64" "$RUNNER_TEMP/arm64.digest"

      - name: Read the amd64 digest
        id: amd64
        run: printf 'digest=%s\n' "$(cat "$RUNNER_TEMP/amd64.digest")" >> "$GITHUB_OUTPUT"

      - name: Read the arm64 digest
        id: arm64
        run: printf 'digest=%s\n' "$(cat "$RUNNER_TEMP/arm64.digest")" >> "$GITHUB_OUTPUT"

      - name: Attest the index's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Attest the amd64 image's SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.amd64.outputs.digest }}
          sbom-path: ${{ runner.temp }}/assets/pingora-panel-${{ steps.release.outputs.version }}-image-linux-amd64.cdx.json
          push-to-registry: true

      - name: Attest the arm64 image's SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.arm64.outputs.digest }}
          sbom-path: ${{ runner.temp }}/assets/pingora-panel-${{ steps.release.outputs.version }}-image-linux-arm64.cdx.json
          push-to-registry: true

      - name: Keep the images' SBOMs for the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-image
          path: ${{ runner.temp }}/assets
          if-no-files-found: error

  cli:
    name: Command line (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: 1.98.0

      - name: Install cargo-auditable
        run: cargo install --locked --version 0.7.7 cargo-auditable

      - name: Build ppanel with the crates it is built from embedded
        run: cargo auditable build --manifest-path panel/Cargo.toml --release --locked --bin ppanel

      - name: Package ppanel
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="ppanel-${GITHUB_REF_NAME#v}-$TARGET"
          mkdir -p "$RUNNER_TEMP/package/$name" "$RUNNER_TEMP/assets"
          cp panel/target/release/ppanel LICENSE "$RUNNER_TEMP/package/$name/"
          tar -C "$RUNNER_TEMP/package" -czf "$RUNNER_TEMP/assets/$name.tar.gz" "$name"

      - name: Keep the package for the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-cli-${{ matrix.target }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error

  evidence:
    name: SBOMs, license notices and deployment files
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: 1.98.0

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: panel/web/package.json

      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install the console's locked dependencies
        working-directory: panel/web
        run: pnpm install --frozen-lockfile

      - name: Install Syft and cargo-about
        run: |
          bash .github/scripts/install-syft.sh "$RUNNER_TEMP/evidence-bin"
          bash .github/scripts/install-cargo-about.sh "$RUNNER_TEMP/evidence-bin"
          printf '%s\n' "$RUNNER_TEMP/evidence-bin" >> "$GITHUB_PATH"

      - name: Write the SBOMs, the license notices and the deployment files
        run: |
          version=${GITHUB_REF_NAME#v}
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          export PINGORA_PANEL_VERSION="$version"
          panel/scripts/supply-chain.sh sbom rust "$assets/pingora-panel-$version-rust.cdx.json"
          panel/scripts/supply-chain.sh sbom web "$assets/pingora-panel-$version-web.cdx.json"
          panel/scripts/supply-chain.sh notices "$assets/THIRD-PARTY-NOTICES.md"
          # The host command installs and verifies the release it came with.
          printf '%s\n' "$version" > panel/deploy/RELEASE
          tar -czf "$assets/pingora-panel-deploy-$version.tar.gz" \
            --exclude=panel/deploy/secrets --exclude=panel/deploy/test-pingora-panel.sh \
            panel/deploy LICENSE

      - name: Keep them for the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-evidence
          path: ${{ runner.temp }}/assets
          if-no-files-found: error

  release:
    name: Signed release
    needs: [index, cli, evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets

      - name: List the assets' digests
        working-directory: ${{ runner.temp }}/assets
        run: sha256sum -- * > SHA256SUMS

      - name: Attest the assets' provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/*

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign every asset without keys
        working-directory: ${{ runner.temp }}/assets
        run: |
          for asset in *; do
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
          done

      - name: Publish the release
        working-directory: ${{ runner.temp }}/assets
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX_DIGEST: ${{ needs.index.outputs.digest }}
        run: |
          version=${GITHUB_REF_NAME#v}
          image="ghcr.io/$GITHUB_REPOSITORY"
          identity="^https://github.com/$GITHUB_REPOSITORY/\.github/workflows/release\.yml@refs/tags/v"
          issuer=https://token.actions.githubusercontent.com
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          The image is \`$image@$INDEX_DIGEST\` (\`$image:$version\`).

          Verify the image and the assets with:

          \`\`\`sh
          cosign verify $image@$INDEX_DIGEST \\
            --certificate-oidc-issuer $issuer --certificate-identity-regexp '$identity'
          gh attestation verify oci://$image@$INDEX_DIGEST --repo $GITHUB_REPOSITORY
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\
            --certificate-oidc-issuer $issuer --certificate-identity-regexp '$identity'
          sha256sum --check --ignore-missing SHA256SUMS
          \`\`\`
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Pingora Panel $version" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag -- *
