name: Pingora upstream canary

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  canary:
    name: Panel adapter against Pingora main
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The vendored Pingora commit the local changes start from is found
          # in the history.
          fetch-depth: 0
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake --no-install-recommends

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-30
        with:
          toolchain: 1.98.0

      - name: Check and test against immutable Pingora main
        run: bash .github/scripts/run-panel-pingora-canary.sh

  report:
    name: Compatibility issue
    needs: canary
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the compatibility issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ needs.canary.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Pingora main canary fails'
          open="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          case "$OUTCOME" in
            success)
              if [[ -n "$open" ]]; then
                gh issue close "$open" --comment "The canary passes again: $RUN_URL"
              fi
              ;;
            failure)
              if [[ -n "$open" ]]; then
                gh issue comment "$open" --body "The canary fails again: $RUN_URL"
              else
                gh issue create --title "$title" --body "The Panel adapter does not build or pass its tests against Pingora's main with the local changes applied: $RUN_URL

          The production baseline stays where it is until the cause and any security impact are understood."
              fi
              ;;
          esac
