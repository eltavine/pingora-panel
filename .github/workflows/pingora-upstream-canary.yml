name: Pingora upstream canary

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  canary:
    name: Panel adapter against Pingora main
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake --no-install-recommends

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-30
        with:
          toolchain: 1.98.0

      - name: Check and test against immutable Pingora main
        run: bash .github/scripts/run-panel-pingora-canary.sh
