name: Secret scanning

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks 8.30.0
        run: |
          bash .github/scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
          printf '%s\n' "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Self-test secret detection and redaction
        run: bash .github/scripts/test-gitleaks-secret-scan.sh "$(command -v gitleaks)"

      - name: Self-test leased baseline policy
        run: python3 .github/scripts/test-gitleaks-baseline.py

      - name: Verify every baseline fingerprint holds a live lease
        run: python3 .github/scripts/check-gitleaks-baseline.py

      - name: Scan complete repository history
        run: gitleaks git --no-banner --redact --exit-code 1 .
