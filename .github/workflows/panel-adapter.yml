name: Panel adapter compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "panel/**"
      - "pingora*/**"
      - "tinyufo/**"
      - ".github/workflows/panel-adapter.yml"
  pull_request:
    paths:
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "panel/**"
      - "pingora*/**"
      - "tinyufo/**"
      - ".github/workflows/panel-adapter.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-pingora:
    name: Gateway Pingora adapter and composition root
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake --no-install-recommends

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: 1.98.0
          components: clippy

      - name: Check adapter and composition root
        run: >-
          cargo check
          --manifest-path panel/Cargo.toml
          --package gateway-pingora
          --package gatewayd
          --all-targets
          --all-features
          --locked

      - name: Test adapter and composition root
        run: >-
          cargo test
          --manifest-path panel/Cargo.toml
          --package gateway-pingora
          --package gatewayd
          --all-features
          --locked

      - name: Lint adapter and composition root
        env:
          CLIPPY_CONF_DIR: ${{ github.workspace }}/panel
        run: >-
          cargo clippy
          --manifest-path panel/Cargo.toml
          --package gateway-pingora
          --package gatewayd
          --all-targets
          --all-features
          --locked
          -- -D warnings
