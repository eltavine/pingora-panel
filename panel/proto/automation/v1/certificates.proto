syntax = "proto3";

package pingora.panel.automation.v1;

import "common/v1/common.proto";

// Keeps the certificate inventory: uploaded, generated and issued server
// certificates whose private keys the service seals and delivers to the
// gateway.
//
// Operations and certificates travel as JSON documents of the certificate
// API's types (the `panel-certificate-api` crate), which both ends share, so
// they can gain fields without changing this contract. Each read and change
// is one operation of a closed set, which audit records refer to by name.
// Private keys are accepted in change requests and never returned.
service Certificates {
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Change(ChangeRequest) returns (ChangeResponse);
}

message ReadRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  // Replaced by `query`, which names the operation and its parameters.
  string operation = 2 [deprecated = true];
  string resource = 3 [deprecated = true];
  bytes parameters = 4 [deprecated = true];
  // The read, a `CertificateQuery` as JSON.
  bytes query = 5;
}

message ReadResponse {
  // The result as JSON.
  bytes content = 1;
  // Entity tag of a single certificate, for conditional changes.
  string etag = 2;
  .pingora.panel.common.v1.Error error = 3;
}

message ChangeRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  // Replaced by `command`, which names the operation, its target and its
  // input.
  string operation = 2 [deprecated = true];
  string resource = 3 [deprecated = true];
  // Entity tag the certificate must still have (RFC 9110 §13.1.1); empty
  // skips the check.
  string if_match = 4;
  bytes content = 5 [deprecated = true];
  // The change, a `CertificateCommand` as JSON; it may hold private keys
  // and secrets.
  bytes command = 6;
}

message ChangeResponse {
  bytes content = 1;
  string etag = 2;
  .pingora.panel.common.v1.Error error = 3;
}
