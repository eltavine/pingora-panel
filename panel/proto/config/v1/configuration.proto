syntax = "proto3";

package pingora.panel.config.v1;

import "common/v1/common.proto";
import "config/v1/config.proto";
import "google/protobuf/timestamp.proto";

// Reads and edits the draft configuration and publishes it to the gateway.
//
// Operations and resources travel as JSON documents of the configuration
// API's types (the `panel-config-api` crate), which both ends share, so the
// model can gain fields without changing this contract. Each read and change
// is one operation of a closed set, which audit records refer to by name.
service Configuration {
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Change(ChangeRequest) returns (ChangeResponse);
  rpc Apply(ApplyRequest) returns (ApplyResponse);
}

// The draft as a whole.
message Draft {
  // Increases with every change.
  uint64 version = 1;
  google.protobuf.Timestamp updated_at = 2;
  // The draft version the gateway runs, when one has been applied.
  optional uint64 applied_version = 3;
  google.protobuf.Timestamp applied_at = 4;
}

message ReadRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  // Replaced by `query`, which names the operation and its parameters.
  string operation = 2 [deprecated = true];
  string resource = 3 [deprecated = true];
  bytes parameters = 4 [deprecated = true];
  // The read, a `ConfigurationQuery` as JSON.
  bytes query = 5;
}

message ReadResponse {
  // The result as JSON.
  bytes content = 1;
  // Entity tag of a single resource, for conditional changes.
  string etag = 2;
  Draft draft = 3;
  .pingora.panel.common.v1.Error error = 4;
}

message ChangeRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  // Replaced by `command`, which names the operation, its target and its
  // input.
  string operation = 2 [deprecated = true];
  string resource = 3 [deprecated = true];
  // Entity tag the target must still have (RFC 9110 §13.1.1); empty skips the check.
  string if_match = 4;
  bytes content = 5 [deprecated = true];
  // The change, a `ConfigurationCommand` as JSON.
  bytes command = 6;
}

message ChangeResponse {
  bytes content = 1;
  string etag = 2;
  Draft draft = 3;
  .pingora.panel.common.v1.Error error = 4;
}

message ApplyRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  // Refuses to apply if the draft has changed since this version; zero skips the check.
  uint64 expected_version = 2;
  // Recorded with the revision.
  string note = 3;
  // Validates and prepares on the gateway without activating.
  bool dry_run = 4;
  // Applies without the approvals policies ask for, recording why; callers
  // allow it only to actors who may bypass approvals.
  string bypass_reason = 5;
  // The incident the bypass answers, such as a ticket reference.
  string bypass_incident = 6;
  // Refuses to apply unless the plan, as `plan` in the language queries
  // digests it, is still this one; empty skips the check.
  string expected_plan = 7;
}

message ApplyResponse {
  Draft draft = 1;
  ActivatedDeployment deployment = 2;
  // Present when the draft was refused before reaching the gateway, and for
  // a dry run that passed.
  ValidationReport report = 3;
  .pingora.panel.common.v1.Error error = 4;
  // The revision the attempt was recorded as; zero for a dry run.
  uint64 revision = 5;
  // The approval request as JSON when policies ask for approvals first;
  // nothing was published.
  bytes approval = 6;
}
