syntax = "proto3";

package pingora.panel.gateway.v1;

import "common/v1/common.proto";
import "gateway/v1/gateway.proto";
import "google/protobuf/timestamp.proto";

// Operates the running data plane. These operations act on the serving
// process rather than on the configuration; worker counts and drained
// endpoints persist across restarts.
service GatewayRuntime {
  rpc GetDataPlane(GetDataPlaneRequest) returns (GetDataPlaneResponse);
  // Starts a new listener generation and drains the previous one.
  rpc ReloadDataPlane(ReloadDataPlaneRequest) returns (ReloadDataPlaneResponse);
  rpc SetWorkerCount(SetWorkerCountRequest) returns (SetWorkerCountResponse);
  // Stops accepting traffic, drains in-flight requests and exits.
  rpc ShutdownGateway(ShutdownGatewayRequest) returns (ShutdownGatewayResponse);
  rpc ListUpstreamHealth(ListUpstreamHealthRequest) returns (ListUpstreamHealthResponse);
  // Takes an endpoint out of rotation, or returns it.
  rpc SetEndpointDrained(SetEndpointDrainedRequest) returns (SetEndpointDrainedResponse);
  // Inspects the files the active configuration serves from.
  rpc CheckFiles(CheckFilesRequest) returns (CheckFilesResponse);
}

message DataPlane {
  // Increases with every reload; zero before the first generation.
  uint64 generation = 1;
  uint32 worker_count = 2;
  repeated DataPlaneListener listeners = 3;
  google.protobuf.Timestamp generation_started_at = 4;
  // Why the configured listeners are not all served.
  string error = 5;
  GatewayRuntimeInfo runtime = 6;
  google.protobuf.Timestamp observed_at = 7;
  uint64 active_revision_id = 8;
  .pingora.panel.common.v1.ContentHash active_hash = 9;
}

message DataPlaneListener {
  string id = 1;
  string address = 2;
  bool tls = 3;
  bool http1 = 4;
  bool http2 = 5;
}

message GetDataPlaneRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
}

message GetDataPlaneResponse {
  DataPlane data_plane = 1;
  .pingora.panel.common.v1.Error error = 2;
}

message ReloadDataPlaneRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
}

message ReloadDataPlaneResponse {
  DataPlane data_plane = 1;
  .pingora.panel.common.v1.Error error = 2;
}

message SetWorkerCountRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  uint32 worker_count = 2;
}

message SetWorkerCountResponse {
  DataPlane data_plane = 1;
  .pingora.panel.common.v1.Error error = 2;
}

message ShutdownGatewayRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
}

message ShutdownGatewayResponse {
  bool accepted = 1;
  .pingora.panel.common.v1.Error error = 2;
}

message EndpointHealth {
  string endpoint_id = 1;
  string address = 2;
  uint32 weight = 3;
  bool enabled = 4;
  bool backup = 5;
  // Active health; endpoints without checks stay healthy.
  bool healthy = 6;
  bool drained = 7;
  // Set while passive health keeps the endpoint out of rotation.
  google.protobuf.Timestamp ejected_until = 8;
  uint32 in_flight = 9;
  uint64 requests = 10;
  uint64 failures = 11;
  // Smoothed time to the upstream response header.
  optional uint64 latency_us = 12;
}

message UpstreamHealth {
  string upstream_id = 1;
  // Whether active health checks run for this upstream.
  bool checked = 2;
  repeated EndpointHealth endpoints = 3;
}

message ListUpstreamHealthRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
}

message ListUpstreamHealthResponse {
  repeated UpstreamHealth upstreams = 1;
  google.protobuf.Timestamp observed_at = 2;
  uint64 active_revision_id = 3;
  .pingora.panel.common.v1.ContentHash active_hash = 4;
  .pingora.panel.common.v1.Error error = 5;
}

message SetEndpointDrainedRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  string upstream_id = 2;
  string endpoint_id = 3;
  bool drained = 4;
}

message SetEndpointDrainedResponse {
  UpstreamHealth upstream = 1;
  .pingora.panel.common.v1.Error error = 2;
}

// What the gateway finds in the files it serves from.
message FileChecks {
  google.protobuf.Timestamp checked_at = 1;
  uint64 active_revision_id = 2;
  repeated PrivateKeyCheck private_keys = 3;
  repeated StaticRootCheck static_roots = 4;
}

message PrivateKeyCheck {
  // The file name in the secret directory.
  string file = 1;
  repeated string tls_profile_ids = 2;
  // Unix permission bits, where the platform has them.
  optional uint32 mode = 3;
  // Whether only the owner may read or write the file.
  bool owner_only = 4;
  // Why the file could not be inspected.
  string error = 5;
}

message StaticRootCheck {
  // The static content the root serves.
  string id = 1;
  string root = 2;
  // Whether the root resolves to a directory inside the static content root.
  bool inside = 3;
  // Links below the root that lead out of it; they are not served.
  repeated EscapingLink escaping_links = 4;
  uint32 entries_checked = 5;
  // Whether the root holds more entries than one check looks at.
  bool truncated = 6;
  string error = 7;
}

message EscapingLink {
  // The link, relative to the root.
  string path = 1;
  string target = 2;
}

message CheckFilesRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
}

message CheckFilesResponse {
  FileChecks checks = 1;
  .pingora.panel.common.v1.Error error = 2;
}
