syntax = "proto3";

package pingora.panel.gateway.v1;

import "common/v1/common.proto";

service GatewayEngine {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  rpc Validate(ValidateRequest) returns (ValidateResponse);
  rpc Prepare(PrepareRequest) returns (PrepareResponse);
  rpc Activate(ActivateRequest) returns (ActivateResponse);
  rpc Abort(AbortRequest) returns (AbortResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

message GetCapabilitiesRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
}

message GetCapabilitiesResponse {
  .pingora.panel.common.v1.Version version = 1;
  repeated .pingora.panel.common.v1.Capability capabilities = 2;
  .pingora.panel.common.v1.Error error = 3;
}

message RuntimeSnapshot {
  string schema_version = 1;
  uint64 revision_id = 2;
  .pingora.panel.common.v1.ContentHash content_hash = 3;
  repeated ListenerRef listeners = 4;
  repeated SiteSpec sites = 5;
  repeated RouteSpec routes = 6;
  repeated UpstreamPoolSpec upstream_pools = 7;
  repeated TlsProfile tls_profiles = 8;
  repeated HeaderPolicy header_policies = 9;
  repeated StaticContentPolicy static_content = 10;
  repeated CachePolicy cache_policies = 11;
  repeated SecurityPolicy security_policies = 12;
  // Reserved: gateways refuse it. Scripts are in `lua`.
  repeated LuaPolicy lua_policies = 13;
  repeated .pingora.panel.common.v1.Capability required_capabilities = 14;
  // Absent keeps the gateway's logging defaults.
  LoggingPolicy logging = 15;
  // The scripts of the configuration (ADR 0039); a snapshot with any
  // requires the `lua.scripts` capability.
  LuaProgram lua = 16;
}

message ListenerRef {
  string id = 1;
  string address = 2;
  bool tls = 3;
  string tls_profile_id = 4;
  // Absent means HTTP/1.1 and HTTP/2 without HTTP/3.
  ListenerProtocols protocols = 5;
  bool reuse_port = 6;
  optional bool ipv6_only = 7;
  string default_site_id = 8;
  // Proxies in these networks name the client in `real_ip_header`.
  repeated string trusted_proxies = 9;
  RealIpHeader real_ip_header = 10;
  // The longest a client may take to send a request head; absent means the
  // gateway's default.
  optional uint64 request_head_timeout_ms = 11;
}

// Where trusted proxies put the client's address; unspecified means
// X-Forwarded-For.
enum RealIpHeader {
  REAL_IP_HEADER_UNSPECIFIED = 0;
  REAL_IP_HEADER_X_FORWARDED_FOR = 1;
  REAL_IP_HEADER_X_REAL_IP = 2;
  // RFC 7239.
  REAL_IP_HEADER_FORWARDED = 3;
}

message ListenerProtocols {
  bool http1 = 1;
  bool http2 = 2;
  bool http3 = 3;
}

message SiteSpec {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  repeated DomainSpec domains = 4;
  repeated string listener_ids = 5;
  bool https_redirect = 6;
  WwwRedirect www_redirect = 7;
  // Sent with every HTTPS response for the site's hosts (RFC 6797).
  StrictTransportSecurity hsts = 8;
  // Every request for the site passes this policy first.
  string security_policy_id = 9;
  AccessLog access_log = 10;
  // Every request for the site passes this HTTP policy before its route's
  // (ADR 0037).
  string header_policy_id = 11;
  // Lua handlers for the site's requests, `server_rewrite` among them.
  LuaHandlers lua = 12;
}

// An HTTP Strict Transport Security policy (RFC 6797 §6.1).
message StrictTransportSecurity {
  // How long browsers keep using HTTPS only; zero makes them forget it.
  uint64 max_age_seconds = 1;
  bool include_subdomains = 2;
  // Consents to inclusion in browsers' preload lists.
  bool preload = 3;
}

enum WwwRedirect {
  WWW_REDIRECT_UNSPECIFIED = 0;
  WWW_REDIRECT_ADD = 1;
  WWW_REDIRECT_REMOVE = 2;
}

message DomainSpec {
  string host = 1;
  string tls_profile_id = 2;
  bool disabled = 3;
  bool primary = 4;
  bool redirect_to_primary = 5;
}

message RouteSpec {
  string id = 1;
  string site_id = 2;
  uint32 priority = 3;
  bool enabled = 4;
  RouteMatcher matcher = 5;
  RouteAction action = 6;
  RetryPolicy retry_policy_v1 = 7;
  string header_policy_id = 8;
  string cache_policy_id = 9;
  string security_policy_id = 10;
  // Reserved: gateways refuse it. Handlers are in `lua`.
  string lua_policy_id = 11;
  string name = 12;
  AccessLog access_log = 13;
  // Every one holds for the requests the route takes, after its matcher
  // (ADR 0036). A gateway refuses kinds it does not know.
  repeated RouteCondition conditions = 14;
  // The Lua handlers the route's requests run, the site's and the
  // configuration's included.
  LuaHandlers lua = 15;
}

// A condition on a request.
message RouteCondition {
  oneof kind {
    // One of the methods, compared case-sensitively.
    MethodCondition method = 1;
    // One of the hosts, or `*.parent` wildcards of one label.
    HostCondition host = 2;
    // A header field by its case-insensitive name, tested as the combined
    // value of its field lines.
    FieldCondition header = 3;
    // A query parameter, decoded as application/x-www-form-urlencoded.
    FieldCondition query = 4;
    // A cookie among the pairs of every Cookie field.
    FieldCondition cookie = 5;
    // The client's address, after trusted proxies.
    ClientCondition client = 6;
    ValueTest user_agent = 7;
    ValueTest referer = 8;
    // The media type without parameters, ignoring case.
    ContentTypeCondition content_type = 9;
    RouteConditions all = 10;
    RouteConditions any = 11;
    RouteCondition not = 12;
  }
}

message MethodCondition {
  repeated string methods = 1;
}

message HostCondition {
  repeated string hosts = 1;
}

message FieldCondition {
  string name = 1;
  ValueTest test = 2;
}

message ClientCondition {
  // Networks such as `10.0.0.0/8`, or single addresses.
  repeated string networks = 1;
}

message ContentTypeCondition {
  // Types such as `application/json`, or ranges such as `text/*`.
  repeated string types = 1;
}

message RouteConditions {
  repeated RouteCondition conditions = 1;
}

// A test of a field, parameter or cookie.
message ValueTest {
  ValueTestOperator operator = 1;
  // The value, or the regular expression; empty for presence and absence.
  string value = 2;
  bool ignore_case = 3;
}

enum ValueTestOperator {
  VALUE_TEST_OPERATOR_UNSPECIFIED = 0;
  VALUE_TEST_OPERATOR_PRESENT = 1;
  VALUE_TEST_OPERATOR_ABSENT = 2;
  VALUE_TEST_OPERATOR_EQUALS = 3;
  VALUE_TEST_OPERATOR_PREFIX = 4;
  VALUE_TEST_OPERATOR_SUFFIX = 5;
  VALUE_TEST_OPERATOR_CONTAINS = 6;
  VALUE_TEST_OPERATOR_REGEX = 7;
}

// Access log settings of every site, of one site or of one route; unset
// values come from the enclosing scope (ADR 0025).
message AccessLog {
  optional bool enabled = 1;
  // Unspecified takes the enclosing scope's format.
  AccessLogFormat format = 2;
  // Extra fields by name, as templates of request variables.
  map<string, string> fields = 3;
}

enum AccessLogFormat {
  ACCESS_LOG_FORMAT_UNSPECIFIED = 0;
  // One JSON object per line, keyed by OpenTelemetry attribute names.
  ACCESS_LOG_FORMAT_JSON = 1;
  // The Combined Log Format.
  ACCESS_LOG_FORMAT_COMBINED = 2;
}

// How the gateway rotates and keeps each log file.
message LogFiles {
  uint64 max_size_bytes = 1;
  // Whether files also rotate at midnight UTC.
  bool rotate_daily = 2;
  // Rotated files older than this are deleted; zero keeps them.
  uint32 keep_days = 3;
  // The most rotated files kept of each log; zero keeps them all.
  uint32 max_files = 4;
}

// Logging for every site, and what is never logged.
message LoggingPolicy {
  AccessLog access = 1;
  // Absent keeps the gateway's rotation and retention defaults.
  LogFiles files = 2;
  // Present replaces the default query parameters whose values are redacted.
  RedactedQuery redact_query = 3;
  // Header names redacted besides the default ones.
  repeated string redact_headers = 4;
}

message RedactedQuery {
  repeated string keys = 1;
}

message RouteMatcher {
  oneof kind {
    string host = 1;
    string path_prefix = 2;
    string exact_path = 3;
    string glob = 4;
    string regex = 5;
    HostPathPrefixMatcher host_path_prefix = 6;
  }
}

message HostPathPrefixMatcher {
  string host = 1;
  string path = 2;
}

message RouteAction {
  oneof kind {
    string upstream_pool_id = 1;
    string static_content_id = 2;
    string redirect_url = 3;
    uint32 return_status = 4;
    RedirectAction redirect = 5;
    RespondAction respond = 6;
    // `content_by_lua`: a handler makes the response.
    LuaHandler lua = 7;
  }
}

message RedirectAction {
  string location = 1;
  uint32 status = 2;
  bool preserve_path = 3;
}
message RespondAction {
  uint32 status = 1;
  string body = 2;
  bool has_body = 3;
  string content_type = 4;
  optional uint32 retry_after_seconds = 5;
}

message UpstreamPoolSpec {
  string id = 1;
  string name = 2;
  repeated UpstreamEndpoint endpoints = 3;
  string load_balancing_policy = 4;
  string retry_policy = 5;
  LoadBalancingPolicy load_balancing_v1 = 6;
  RetryPolicy retry_policy_v1 = 7;
  UpstreamConnectionPolicy connection = 8;
  UpstreamTlsPolicy tls = 9;
  string host_header = 10;
  ActiveHealthCheck health_check = 11;
  PassiveHealthPolicy passive_health = 12;
  CircuitBreaker circuit_breaker = 13;
  optional uint32 max_requests = 14;
  UpstreamQueue queue = 15;
  // `balancer_by_lua`: chooses the endpoint of each try.
  LuaHandler balancer = 16;
}

message UpstreamConnectionPolicy {
  optional uint64 connect_timeout_ms = 1;
  optional uint64 read_timeout_ms = 2;
  optional uint64 write_timeout_ms = 3;
  optional uint64 idle_timeout_ms = 4;
  bool disable_keepalive = 5;
  optional uint32 max_connections = 6;
  bool http2 = 7;
  bool h2c = 8;
}

message UpstreamTlsPolicy {
  bool skip_certificate_verification = 1;
  bool skip_hostname_verification = 2;
  string ca_secret_id = 3;
  string sni = 4;
}

enum HealthCheckProtocol {
  HEALTH_CHECK_PROTOCOL_UNSPECIFIED = 0;
  HEALTH_CHECK_PROTOCOL_HTTP = 1;
  HEALTH_CHECK_PROTOCOL_TCP = 2;
}

message ActiveHealthCheck {
  HealthCheckProtocol protocol = 1;
  string path = 2;
  string method = 3;
  uint64 interval_ms = 4;
  uint64 timeout_ms = 5;
  uint32 healthy_threshold = 6;
  uint32 unhealthy_threshold = 7;
  repeated uint32 expected_statuses = 8;
  string host = 9;
}

message PassiveHealthPolicy {
  uint32 failure_threshold = 1;
  uint64 ejection_ms = 2;
}

message UpstreamEndpoint {
  string id = 1;
  string address = 2;
  uint32 port = 3;
  bool tls = 4;
  string sni = 5;
  uint32 weight = 6;
  bool disabled = 7;
  bool backup = 8;
  string unix_socket = 9;
}

message LoadBalancingPolicy {
  oneof kind {
    bool round_robin = 1;
    bool random = 2;
    string consistent_hash_key = 3;
  }
}

message RetryPolicy {
  uint32 attempts = 1;
  uint64 per_try_timeout_ms = 2;
  repeated uint32 retry_statuses = 3;
  repeated RetryCondition retry_on = 4;
  uint64 backoff_ms = 5;
  RetryBudget budget = 6;
}

enum RetryCondition {
  RETRY_CONDITION_UNSPECIFIED = 0;
  RETRY_CONDITION_TIMEOUT = 1;
  RETRY_CONDITION_RESET = 2;
}

message RetryBudget {
  uint32 percent = 1;
  uint32 min_per_second = 2;
}

message CircuitBreaker {
  uint32 failure_percent = 1;
  uint32 min_requests = 2;
  uint64 open_ms = 3;
  uint32 half_open_requests = 4;
}

message UpstreamQueue {
  uint32 max_waiting = 1;
  uint64 timeout_ms = 2;
}

message TlsProfile {
  string id = 1;
  string certificate_ref = 2;
  string private_key_secret_id = 3;
  string min_protocol = 4;
  // ALPN protocol IDs a listener using this profile offers, narrowing the
  // listener's enabled protocols; empty offers all of them. A profile chosen
  // by SNI for a domain does not change its listener's offer.
  repeated string alpn = 5;
  // The newest TLS version accepted; the newest supported when empty.
  string max_protocol = 6;
  // IANA names of the cipher suites accepted; empty accepts the defaults.
  repeated string cipher_suites = 7;
  // Refuses resuming sessions by session IDs and tickets.
  bool session_resumption_disabled = 8;
}

// An HTTP policy (ADR 0037); values are templates of request variables. A
// gateway refuses codings and Server modes it does not know.
message HeaderPolicy {
  string id = 1;
  map<string, string> set = 2;
  repeated string remove = 3;
  map<string, string> request_set = 4;
  repeated string request_remove = 5;
  map<string, string> response_set = 6;
  repeated string response_remove = 7;
  // Field lines appended, in order.
  repeated HeaderField request_add = 8;
  repeated HeaderField response_add = 9;
  reserved 10;
  ServerHeader server = 11;
  CorsPolicy cors = 12;
  CompressionPolicy compression = 13;
}

message HeaderField {
  string name = 1;
  string value = 2;
}

// What becomes of the upstream's Server field; unspecified keeps it.
message ServerHeader {
  ServerHeaderMode mode = 1;
  // With REPLACE, the value sent instead.
  string value = 2;
}

enum ServerHeaderMode {
  SERVER_HEADER_MODE_UNSPECIFIED = 0;
  SERVER_HEADER_MODE_KEEP = 1;
  SERVER_HEADER_MODE_REMOVE = 2;
  SERVER_HEADER_MODE_REPLACE = 3;
}

// The Fetch Standard's CORS protocol for the origins listed.
message CorsPolicy {
  repeated string allowed_origins = 1;
  repeated string allowed_methods = 2;
  repeated string allowed_headers = 3;
  repeated string exposed_headers = 4;
  bool allow_credentials = 5;
  optional uint32 max_age_seconds = 6;
}

// Which responses are compressed, with the codings the client accepts.
message CompressionPolicy {
  repeated CompressionAlgorithm algorithms = 1;
  // Media types such as text/html, or ranges such as text/*.
  repeated string types = 2;
  uint64 min_bytes = 3;
}

enum CompressionAlgorithm {
  COMPRESSION_ALGORITHM_UNSPECIFIED = 0;
  COMPRESSION_ALGORITHM_GZIP = 1;
  COMPRESSION_ALGORITHM_BROTLI = 2;
  COMPRESSION_ALGORITHM_ZSTD = 3;
}

message StaticContentPolicy {
  string id = 1;
  string root = 2;
  bool spa_fallback = 3;
  repeated string index_files = 4;
}

message CachePolicy {
  string id = 1;
  bool enabled = 2;
  uint64 ttl_seconds = 3;
  repeated string vary_headers = 4;
}

// Restrictions a request must pass before its site or route handles it.
message SecurityPolicy {
  string id = 1;
  // Client networks; when any are listed, other clients are refused.
  repeated string allowed_cidrs = 2;
  // Requests per second per client address, when `has_request_rate`; the
  // first form of a rate limit, which `rate_limits` generalizes.
  uint64 request_rate = 3;
  repeated string denied_cidrs = 4;
  bool has_request_rate = 5;
  // Empty allows every method.
  repeated string allowed_methods = 6;
  repeated string denied_path_prefixes = 7;
  // Case-insensitive regular expressions.
  repeated string denied_user_agents = 8;
  RefererRule referer = 9;
  BasicAuth basic_auth = 10;
  optional uint64 max_header_bytes = 11;
  optional uint64 max_body_bytes = 12;
  // The longest wait for the next part of a request body.
  optional uint64 body_timeout_ms = 13;
  repeated RateLimit rate_limits = 14;
  // The most requests one client address may have in progress.
  optional uint64 max_concurrent_requests = 15;
  // The answer to requests over a limit, instead of 429.
  LimitedResponse limited_response = 16;
}

// Which pages may link to the site's resources.
message RefererRule {
  // Hosts of referring pages, with `*.` for any one or more labels.
  repeated string allowed_hosts = 1;
  bool allow_empty = 2;
}

// Basic authentication (RFC 7617) against an htpasswd file.
message BasicAuth {
  string realm = 1;
  string users_secret_id = 2;
}

// What a rate limit counts requests by.
enum RateLimitKey {
  RATE_LIMIT_KEY_UNSPECIFIED = 0;
  RATE_LIMIT_KEY_CLIENT_ADDRESS = 1;
  RATE_LIMIT_KEY_HOST = 2;
  RATE_LIMIT_KEY_ROUTE = 3;
  // The value of the header named in `header`.
  RATE_LIMIT_KEY_HEADER = 4;
}

// A token bucket: `requests` per `per_seconds`, holding `burst` more.
message RateLimit {
  RateLimitKey key = 1;
  string header = 2;
  uint64 requests = 3;
  uint64 per_seconds = 4;
  uint64 burst = 5;
}

message LimitedResponse {
  uint32 status = 1;
  string body = 2;
  string content_type = 3;
}

// Reserved: gateways refuse it. Scripts are in LuaProgram.
message LuaPolicy {
  string id = 1;
  string script_ref = 2;
  repeated string capabilities = 3;
  uint64 instruction_limit = 4;
  uint64 timeout_ms = 5;
  uint64 memory_limit_bytes = 6;
}

// Lua source text and where it comes from.
message LuaScript {
  // Unique in the snapshot: the file of a module, `file:line` of an inline
  // block.
  string id = 1;
  string file = 2;
  // The line of `file` the source starts on, from 1.
  uint32 line = 3;
  string source = 4;
  // Lowercase hexadecimal SHA-256 of `source`.
  string sha256 = 5;
  // What `require` loads it by: set for files under `lua/`.
  string module = 6;
}

// What scripts may do beyond reading and changing the request and response.
message LuaPermissions {
  bool body = 1;
  bool upstream = 2;
  bool network = 3;
}

enum LuaFallbackKind {
  // Answers 500, or 502 in the balancer.
  LUA_FALLBACK_KIND_UNSPECIFIED = 0;
  // Goes on as if the handler had not run.
  LUA_FALLBACK_KIND_CONTINUE = 1;
  // Answers with `LuaFallback.status`.
  LUA_FALLBACK_KIND_STATUS = 2;
}

message LuaFallback {
  LuaFallbackKind kind = 1;
  uint32 status = 2;
}

enum LuaLogLevel {
  // `notice`.
  LUA_LOG_LEVEL_UNSPECIFIED = 0;
  LUA_LOG_LEVEL_STDERR = 1;
  LUA_LOG_LEVEL_EMERG = 2;
  LUA_LOG_LEVEL_ALERT = 3;
  LUA_LOG_LEVEL_CRIT = 4;
  LUA_LOG_LEVEL_ERROR = 5;
  LUA_LOG_LEVEL_WARN = 6;
  LUA_LOG_LEVEL_NOTICE = 7;
  LUA_LOG_LEVEL_INFO = 8;
  LUA_LOG_LEVEL_DEBUG = 9;
}

// The defaults of the cosockets a handler's scripts open, as the
// lua_socket_* directives set them; zero keeps the gateway's.
message LuaSockets {
  uint64 connect_timeout_ms = 1;
  uint64 send_timeout_ms = 2;
  uint64 read_timeout_ms = 3;
  // Bytes a read takes from a connection at a time.
  uint64 buffer_bytes = 4;
  // Idle connections setkeepalive keeps for a pool.
  uint64 pool_size = 5;
  // How long setkeepalive keeps an idle connection.
  uint64 keepalive_timeout_ms = 6;
  // Failures are not written to the error log (lua_socket_log_errors off).
  bool quiet = 7;
}

// A script run in a phase, and the terms it runs on. Zero limits keep the
// gateway's defaults.
message LuaHandler {
  string script_id = 1;
  uint64 time_limit_ms = 2;
  uint64 work_limit = 3;
  LuaPermissions allow = 4;
  LuaFallback on_error = 5;
  LuaLogLevel log_level = 6;
  uint64 slow_threshold_ms = 7;
  bool debug = 8;
  LuaSockets sockets = 9;
  // ngx.header keeps underscores in names
  // (lua_transform_underscores_in_response_headers off).
  bool keep_underscores = 10;
  // An answer without a Content-Type gets none (lua_use_default_type off).
  bool no_default_type = 11;
  // The request body is read before the handler runs
  // (lua_need_request_body on).
  bool read_body_first = 12;
}

// The handlers a site or route runs, by phase.
message LuaHandlers {
  LuaHandler server_rewrite = 1;
  LuaHandler rewrite = 2;
  LuaHandler access = 3;
  LuaHandler header_filter = 4;
  LuaHandler body_filter = 5;
  LuaHandler log = 6;
}

message LuaSharedDict {
  string name = 1;
  uint64 capacity_bytes = 2;
}

message LuaProgram {
  // `lua off`: the scripts stay but none runs.
  bool disabled = 1;
  repeated LuaScript scripts = 2;
  LuaHandler init = 3;
  LuaHandler init_worker = 4;
  repeated LuaSharedDict shared_dicts = 5;
  // Bytes each VM may allocate; zero keeps the gateway's default.
  uint64 memory_limit_bytes = 6;
  // Timers each VM may hold waiting (lua_max_pending_timers); zero keeps
  // 1024.
  uint64 max_pending_timers = 7;
  // Timers each VM may run at once (lua_max_running_timers); zero keeps 256.
  uint64 max_running_timers = 8;
  // Compiled regular expressions each VM keeps
  // (lua_regex_cache_max_entries): 1024 when unset, none at zero.
  optional uint64 regex_cache_max_entries = 9;
  // PCRE2's match limit for ngx.re (lua_regex_match_limit); zero keeps
  // PCRE2's own.
  uint64 regex_match_limit = 10;
  // Access handlers run before the security policies
  // (access_by_lua_no_postpone on).
  bool access_first = 11;
}

message ValidateRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  RuntimeSnapshot snapshot = 2;
}

message ValidateResponse {
  .pingora.panel.common.v1.Version version = 1;
  bool valid = 2;
  repeated .pingora.panel.common.v1.Diagnostic diagnostics = 3;
  .pingora.panel.common.v1.Error error = 4;
}

message PrepareRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  RuntimeSnapshot snapshot = 2;
}

message PrepareResponse {
  .pingora.panel.common.v1.Version version = 1;
  string prepare_token = 2;
  uint64 revision_id = 3;
  .pingora.panel.common.v1.ContentHash content_hash = 4;
  repeated .pingora.panel.common.v1.Diagnostic diagnostics = 5;
  .pingora.panel.common.v1.Error error = 6;
}

message ActivateRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  string prepare_token = 2;
  .pingora.panel.common.v1.ContentHash expected_active_hash = 3;
}

message ActivateResponse {
  .pingora.panel.common.v1.Version version = 1;
  uint64 revision_id = 2;
  .pingora.panel.common.v1.ContentHash active_hash = 3;
  .pingora.panel.common.v1.ContentHash previous_active_hash = 4;
  .pingora.panel.common.v1.Error error = 5;
}

message AbortRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  string prepare_token = 2;
}

message AbortResponse {
  .pingora.panel.common.v1.Version version = 1;
  bool aborted = 2;
  .pingora.panel.common.v1.Error error = 3;
}

message StatusRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
}

message GatewayRuntimeInfo {
  string gateway_version = 1;
  string data_plane_version = 2;
  string adapter_version = 3;
  uint64 started_at_unix_seconds = 4;
  uint64 uptime_seconds = 5;
  uint32 worker_count = 6;
}

message EventDeliveryHealth {
  uint64 queue_full_events = 1;
  uint64 disconnected_events = 2;
  uint64 consumer_panics = 3;
}

message RecoveryHealth {
  uint64 recovery_completed = 1;
  uint64 degraded_events = 2;
  uint64 unknown_commit_outcomes = 3;
}

message StatusResponse {
  .pingora.panel.common.v1.Version version = 1;
  .pingora.panel.common.v1.HealthStatus health = 2;
  uint64 active_revision_id = 3;
  .pingora.panel.common.v1.ContentHash active_hash = 4;
  .pingora.panel.common.v1.Error error = 5;
  uint64 prepared_count = 6;
  GatewayRuntimeInfo runtime = 7;
  EventDeliveryHealth event_delivery = 8;
  RecoveryHealth recovery = 9;
}
