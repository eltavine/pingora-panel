syntax = "proto3";

package pingora.panel.ops.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

// The container engines the agent reaches and what runs on them (ADR 0031).
// Engines are named `docker` or `podman`; which sockets they are is the
// agent's configuration, never the caller's.
service Containers {
  rpc Engines(ContainersEnginesRequest) returns (ContainersEnginesResponse);
  // Enables or disables an engine; the agent keeps the choice.
  rpc SetEngine(ContainersSetEngineRequest) returns (ContainersSetEngineResponse);
  rpc List(ContainersListRequest) returns (ContainersListResponse);
  // Starts, stops, restarts, kills or removes a container. The containers
  // of the panel's own installation are only ever started; Compose manages
  // them otherwise.
  rpc Act(ContainersActRequest) returns (ContainersActResponse);
  // A container's configuration and state, without its environment or
  // command line, which carry secrets.
  rpc Inspect(ContainersInspectRequest) returns (ContainersInspectResponse);
  // The last lines a container printed, as its engine's log driver kept
  // them. What a container prints can hold secrets.
  rpc Logs(ContainersLogsRequest) returns (ContainersLogsResponse);
  // The lines a container prints, as it prints them, until the caller
  // hangs up or the container stops.
  rpc FollowLogs(ContainersFollowLogsRequest) returns (stream ContainersFollowLogsResponse);
  // What running containers use, read once as `docker stats --no-stream`
  // does: CPU over about a second, memory, network, block I/O and
  // processes.
  rpc Stats(ContainersStatsRequest) returns (ContainersStatsResponse);
}

message EngineVersion {
  // Such as `28.3.3`.
  string version = 1;
  string api_version = 2;
  string os = 3;
  string architecture = 4;
  string kernel_version = 5;
  string go_version = 6;
}

message EngineInfo {
  uint32 containers = 1;
  uint32 running = 2;
  uint32 paused = 3;
  uint32 stopped = 4;
  uint32 images = 5;
  string storage_driver = 6;
  string cgroup_driver = 7;
  string operating_system = 8;
  uint32 cpus = 9;
  uint64 memory_bytes = 10;
  // The host's name as the engine reports it.
  string name = 11;
}

message Engine {
  // `docker` or `podman`.
  string id = 1;
  // The socket on the host.
  string socket = 2;
  bool enabled = 3;
  // False when the agent cannot reach it; version and info are then unset.
  bool reachable = 4;
  // Why it is unreachable.
  string detail = 5;
  EngineVersion version = 6;
  EngineInfo info = 7;
}

message ContainersEnginesRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
}

message ContainersEnginesResponse {
  repeated Engine engines = 1;
  .pingora.panel.common.v1.Error error = 2;
}

message ContainersSetEngineRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  string engine = 2;
  bool enabled = 3;
}

message ContainersSetEngineResponse {
  Engine engine = 1;
  .pingora.panel.common.v1.Error error = 2;
}

enum ContainerState {
  CONTAINER_STATE_UNSPECIFIED = 0;
  CONTAINER_STATE_CREATED = 1;
  CONTAINER_STATE_RUNNING = 2;
  CONTAINER_STATE_PAUSED = 3;
  CONTAINER_STATE_RESTARTING = 4;
  CONTAINER_STATE_EXITED = 5;
  CONTAINER_STATE_REMOVING = 6;
  CONTAINER_STATE_DEAD = 7;
  CONTAINER_STATE_STOPPING = 8;
}

message PortMapping {
  // The container's port.
  uint32 private_port = 1;
  // The host's port; 0 when it is not published.
  uint32 public_port = 2;
  // The host address it is published on, such as `0.0.0.0`.
  string host_ip = 3;
  // `tcp`, `udp` or `sctp`.
  string protocol = 4;
}

// An address a container has on a network.
message ContainerAddress {
  // Such as `bridge` or `shop_default`.
  string network = 1;
  // Empty when it has none.
  string ipv4 = 2;
  string ipv6 = 3;
}

// A container as a list shows it; its command is left out, since command
// lines carry secrets.
message Container {
  string id = 1;
  // Without the leading slash.
  repeated string names = 2;
  string image = 3;
  string image_id = 4;
  google.protobuf.Timestamp created = 5;
  ContainerState state = 6;
  // Such as `Up 3 hours (healthy)`.
  string status = 7;
  repeated PortMapping ports = 8;
  map<string, string> labels = 9;
  // The Compose project that created it, if one did.
  string compose_project = 10;
  // By network, on networks other than the host's.
  repeated ContainerAddress addresses = 11;
}

message ContainersListRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  string engine = 2;
  // Matched against names and images, ignoring case; empty for every one.
  string search = 3;
  // Only containers in these states; every state when empty.
  repeated ContainerState states = 4;
}

message ContainersListResponse {
  google.protobuf.Timestamp observed_at = 1;
  repeated Container containers = 2;
  .pingora.panel.common.v1.Error error = 3;
}

enum ContainerAction {
  CONTAINER_ACTION_UNSPECIFIED = 0;
  CONTAINER_ACTION_START = 1;
  // The container's stop signal, then SIGKILL once its stop timeout passes.
  CONTAINER_ACTION_STOP = 2;
  CONTAINER_ACTION_RESTART = 3;
  // SIGKILL at once.
  CONTAINER_ACTION_KILL = 4;
  CONTAINER_ACTION_REMOVE = 5;
}

message ContainersActRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  string engine = 2;
  // Its ID, a unique prefix of its ID, or its name.
  string container = 3;
  ContainerAction action = 4;
  // For REMOVE: a running container is killed and removed rather than
  // refused.
  bool force = 5;
  // For REMOVE: its anonymous volumes are removed with it.
  bool remove_volumes = 6;
}

message ContainersActResponse {
  // Its ID and name as they were before the action.
  string id = 1;
  string name = 2;
  // The container afterwards; unset once removed.
  Container container = 3;
  .pingora.panel.common.v1.Error error = 4;
}

message ContainerMount {
  // `volume`, `bind`, `tmpfs` and so on.
  string type = 1;
  // The volume's name, for a volume.
  string name = 2;
  // Where it comes from on the host.
  string source = 3;
  // Where it appears in the container.
  string destination = 4;
  bool read_write = 5;
}

message ContainerNetwork {
  string name = 1;
  string ip_address = 2;
  string ipv6_address = 3;
  string gateway = 4;
  string mac_address = 5;
  repeated string aliases = 6;
}

// What inspecting a container shows, without its environment or command
// line, which carry secrets.
message ContainerDetail {
  Container container = 1;
  // When it last started and last stopped; unset when it never has.
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp finished_at = 3;
  // How it last stopped; 0 until it has.
  int64 exit_code = 4;
  // Why it last failed, in the engine's words.
  string error = 5;
  bool oom_killed = 6;
  // How often the engine restarted it under its restart policy.
  uint32 restarts = 7;
  // `healthy`, `unhealthy` or `starting`; empty without a health check.
  string health = 8;
  // `no`, `always`, `unless-stopped` or `on-failure`.
  string restart_policy = 9;
  // How often `on-failure` restarts it; 0 for no limit.
  uint32 restart_retries = 10;
  string hostname = 11;
  string user = 12;
  string working_directory = 13;
  // Such as `linux`.
  string platform = 14;
  repeated ContainerMount mounts = 15;
  repeated ContainerNetwork networks = 16;
}

message ContainersInspectRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  string engine = 2;
  // Its ID, a unique prefix of its ID, or its name.
  string container = 3;
}

message ContainersInspectResponse {
  ContainerDetail detail = 1;
  .pingora.panel.common.v1.Error error = 2;
}

enum ContainerLogStream {
  CONTAINER_LOG_STREAM_UNSPECIFIED = 0;
  // Standard output, and everything a container with a terminal prints.
  CONTAINER_LOG_STREAM_STDOUT = 1;
  CONTAINER_LOG_STREAM_STDERR = 2;
}

message ContainerLogLine {
  // When the engine recorded it.
  google.protobuf.Timestamp time = 1;
  ContainerLogStream stream = 2;
  // Without its line break, with invalid UTF-8 replaced, and cut at 16 KiB.
  string text = 3;
}

message ContainersLogsRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  string engine = 2;
  // Its ID, a unique prefix of its ID, or its name.
  string container = 3;
  // The last this many lines, at most 5000; 200 when 0.
  uint32 lines = 4;
  // Only lines at or after this time; every line when unset.
  google.protobuf.Timestamp since = 5;
}

message ContainersLogsResponse {
  google.protobuf.Timestamp observed_at = 1;
  // Oldest first.
  repeated ContainerLogLine lines = 2;
  // Older lines were left out to keep the answer within 2 MiB.
  bool truncated = 3;
  .pingora.panel.common.v1.Error error = 4;
}

message ContainersFollowLogsRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  string engine = 2;
  // Its ID, a unique prefix of its ID, or its name.
  string container = 3;
  // How many of the lines printed before to send first, at most 1000.
  uint32 lines = 4;
  // Resumes after the line printed at this time, the last one received,
  // instead.
  google.protobuf.Timestamp after = 5;
}

message ContainersFollowLogsResponse {
  // Oldest first.
  repeated ContainerLogLine lines = 1;
  // Ends the stream, in a response without lines: the engine failed, or
  // too many logs are followed.
  .pingora.panel.common.v1.Error error = 2;
}

// Summed over a container's interfaces.
message ContainerNetworkStats {
  uint64 received_bytes = 1;
  uint64 sent_bytes = 2;
  uint64 received_packets = 3;
  uint64 sent_packets = 4;
  // Packets received or sent in error.
  uint64 errors = 5;
  // Packets dropped on the way in or out.
  uint64 dropped = 6;
}

message ContainerStats {
  string id = 1;
  // Without the leading slash.
  string name = 2;
  // When the engine read them.
  google.protobuf.Timestamp read_at = 3;
  // Of one CPU, over about a second: 250 is two and a half CPUs busy.
  double cpu_percent = 4;
  // The CPUs the container may use.
  uint32 online_cpus = 5;
  // Without the page cache the kernel can reclaim, as `docker stats`
  // counts it.
  uint64 memory_bytes = 6;
  // The host's memory when the container has no limit.
  uint64 memory_limit_bytes = 7;
  // Unset for a container without a network of its own, such as one on
  // the host's.
  ContainerNetworkStats network = 8;
  uint64 block_read_bytes = 9;
  uint64 block_written_bytes = 10;
  // Processes and threads.
  uint64 pids = 11;
}

message ContainersStatsRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  string engine = 2;
  // Its ID, a unique prefix of its ID, or its name; every running
  // container when empty.
  string container = 3;
}

message ContainersStatsResponse {
  google.protobuf.Timestamp observed_at = 1;
  // By name.
  repeated ContainerStats stats = 2;
  .pingora.panel.common.v1.Error error = 3;
}
