syntax = "proto3";

package pingora.panel.ops.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

// What the container engines the agent reaches keep besides containers and
// images (ADR 0031): their networks and volumes, and the disk all of it
// takes.
service EngineResources {
  rpc ListNetworks(EngineResourcesListNetworksRequest) returns (EngineResourcesListNetworksResponse);
  rpc ListVolumes(EngineResourcesListVolumesRequest) returns (EngineResourcesListVolumesResponse);
  // How much disk images, containers, volumes and the build cache take, and
  // how much removing what is not in use would free, as `docker system df`
  // reports it.
  rpc DiskUsage(EngineResourcesDiskUsageRequest) returns (EngineResourcesDiskUsageResponse);
  // What pruning would remove: containers that are not running, images no
  // container uses, volumes nothing mounts, networks no container is on and
  // build cache not in use; never what the panel's own installation made,
  // nor the engine's own networks.
  rpc PrunePreview(EngineResourcesPrunePreviewRequest) returns (EngineResourcesPrunePreviewResponse);
  // Removes the items of a preview that a preview with the same choices
  // still lists, one at a time, so what came into use meanwhile stays.
  rpc Prune(EngineResourcesPruneRequest) returns (EngineResourcesPruneResponse);
}

message EngineSubnet {
  // Such as `172.18.0.0/16`.
  string subnet = 1;
  string gateway = 2;
}

message EngineNetwork {
  string id = 1;
  string name = 2;
  // Such as `bridge`, `host`, `overlay` or `macvlan`.
  string driver = 3;
  // `local`, `global` or `swarm`.
  string scope = 4;
  google.protobuf.Timestamp created = 5;
  // Whether containers on it are cut off from outside networks.
  bool internal = 6;
  bool ipv6 = 7;
  repeated EngineSubnet subnets = 8;
  // The containers, running or not, attached to it.
  uint32 containers = 9;
  // The Compose project that created it, if one did.
  string compose_project = 10;
  map<string, string> labels = 11;
}

message EngineVolume {
  string name = 1;
  // Such as `local`.
  string driver = 2;
  // Where its data lives on the host.
  string mountpoint = 3;
  google.protobuf.Timestamp created = 4;
  // `local` or `global`.
  string scope = 5;
  // The containers, running or not, that mount it.
  uint32 containers = 6;
  // The Compose project that created it, if one did.
  string compose_project = 7;
  map<string, string> labels = 8;
}

message EngineResourcesListNetworksRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  string engine = 2;
}

message EngineResourcesListNetworksResponse {
  google.protobuf.Timestamp observed_at = 1;
  // By name.
  repeated EngineNetwork networks = 2;
  .pingora.panel.common.v1.Error error = 3;
}

message EngineResourcesListVolumesRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  string engine = 2;
}

message EngineResourcesListVolumesResponse {
  google.protobuf.Timestamp observed_at = 1;
  // By name.
  repeated EngineVolume volumes = 2;
  .pingora.panel.common.v1.Error error = 3;
}

// One kind of thing an engine keeps on disk.
message EngineDiskUse {
  uint32 total = 1;
  // In use: running containers, images and volumes a container uses, and
  // build cache in use.
  uint32 active = 2;
  uint64 size_bytes = 3;
  // What removing what is not in use would free.
  uint64 reclaimable_bytes = 4;
}

message EngineResourcesDiskUsageRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  string engine = 2;
}

message EngineResourcesDiskUsageResponse {
  google.protobuf.Timestamp observed_at = 1;
  EngineDiskUse images = 2;
  EngineDiskUse containers = 3;
  // Local volumes.
  EngineDiskUse volumes = 4;
  EngineDiskUse build_cache = 5;
  .pingora.panel.common.v1.Error error = 6;
}

enum EnginePruneKind {
  ENGINE_PRUNE_KIND_UNSPECIFIED = 0;
  ENGINE_PRUNE_KIND_CONTAINER = 1;
  ENGINE_PRUNE_KIND_IMAGE = 2;
  ENGINE_PRUNE_KIND_VOLUME = 3;
  ENGINE_PRUNE_KIND_NETWORK = 4;
  ENGINE_PRUNE_KIND_BUILD_CACHE = 5;
}

message EnginePruneItem {
  EnginePruneKind kind = 1;
  // Its ID, or a volume's name.
  string id = 2;
  // How people know it: a container's, volume's or network's name, an
  // image's tag, what a build cache record holds.
  string name = 3;
  // What removing it frees, as far as the engine says.
  uint64 size_bytes = 4;
}

// What pruning looks at besides containers, images nothing names,
// anonymous volumes, networks and build cache.
message EnginePruneChoices {
  // Images a tag still names but no container uses.
  bool tagged_images = 1;
  // Volumes a name was given, which usually hold data someone meant to keep.
  bool named_volumes = 2;
}

message EngineResourcesPrunePreviewRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  string engine = 2;
  EnginePruneChoices choices = 3;
}

message EngineResourcesPrunePreviewResponse {
  google.protobuf.Timestamp observed_at = 1;
  // By kind, then name.
  repeated EnginePruneItem items = 2;
  // What removing them all would free.
  uint64 reclaimable_bytes = 3;
  .pingora.panel.common.v1.Error error = 4;
}

message EngineResourcesPruneRequest {
  .pingora.panel.common.v1.RequestContext context = 1;
  string engine = 2;
  // The choices of the preview the items come from.
  EnginePruneChoices choices = 3;
  // At most 1000.
  repeated EnginePruneItem items = 4;
}

message EnginePruneOutcome {
  EnginePruneItem item = 1;
  // Why it stayed; unset once it is gone.
  .pingora.panel.common.v1.Error error = 2;
}

message EngineResourcesPruneResponse {
  // In the order of the request.
  repeated EnginePruneOutcome outcomes = 1;
  // What the items that went freed.
  uint64 reclaimed_bytes = 2;
  .pingora.panel.common.v1.Error error = 3;
}
