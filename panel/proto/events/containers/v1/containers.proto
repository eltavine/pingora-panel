syntax = "proto3";

// The data of events about container engines and what runs on them
// (ADR 0031). Each message is the data of one event type, named in its
// comment; events carry it as JSON in the proto3 JSON mapping, with the
// field names below.
package pingora.panel.events.containers.v1;

// `container.engine.enabled`
message EngineEnabled {
  // `docker` or `podman`.
  string engine = 1;
}

// `container.engine.disabled`
message EngineDisabled {
  string engine = 1;
}

// `container.started`
message ContainerStarted {
  string engine = 1;
  string id = 2;
  // Without the leading slash.
  string name = 3;
}

// `container.stopped`
message ContainerStopped {
  string engine = 1;
  string id = 2;
  string name = 3;
}

// `container.restarted`
message ContainerRestarted {
  string engine = 1;
  string id = 2;
  string name = 3;
}

// `container.killed`
message ContainerKilled {
  string engine = 1;
  string id = 2;
  string name = 3;
}

// `container.removed`
message ContainerRemoved {
  string engine = 1;
  string id = 2;
  string name = 3;
  // Whether it was killed first because it was running.
  bool force = 4;
  // Whether its anonymous volumes went with it.
  bool remove_volumes = 5;
}

// `container.image.removed`
message ImageRemoved {
  string engine = 1;
  // The image's ID before it was removed.
  string id = 2;
  // The image as the operation named it.
  string image = 3;
  // The references removed.
  repeated string untagged = 4;
  // The images and layers deleted; none when other references remain.
  repeated string deleted = 5;
  // Whether it was removed though stopped containers used it.
  bool force = 6;
}

// `container.engine.pruned`
message EnginePruned {
  string engine = 1;
  // What went, each as its kind and name, such as `container cache`.
  repeated string removed = 2;
  // How many of the items asked for stayed.
  uint32 kept = 3;
  // What the items that went freed.
  uint64 reclaimed_bytes = 4;
}

// `container.operation.refused`: an operation on an engine that was refused
// or failed, and changed nothing.
message OperationRefused {
  string engine = 1;
  // Such as `engine.disable` or `container.restart`.
  string operation = 2;
  string code = 3;
  string message = 4;
  // The container as the operation named it, for operations on one.
  string container = 5;
  // The image as the operation named it, for operations on one.
  string image = 6;
}
