[package]
name = "panel-contracts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
panel-errors.workspace = true
prost.workspace = true
prost-types.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

[build-dependencies]
protoc-bin-vendored = "=3.2.0"
tonic-prost-build.workspace = true

[package.metadata.pingora-panel]
# Buf, not the Rust API check, guards what is generated from Protobuf.
generated-from = "protobuf"

[package.metadata.cargo-machete]
# Generated code included by tonic::include_proto! references the runtime codec
# and the well-known protobuf types.
ignored = ["prost-types", "tonic-prost"]
