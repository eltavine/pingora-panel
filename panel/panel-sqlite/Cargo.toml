[package]
name = "panel-sqlite"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Disposable databases for integration tests in this and dependent crates.
test-support = ["dep:tempfile"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
panel-errors.workspace = true
panel-event-codec.workspace = true
panel-events.workspace = true
panel-health.workspace = true
panel-outbox.workspace = true
sqlx.workspace = true
tempfile = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
panel-sqlite = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
