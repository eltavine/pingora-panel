[workspace]
resolver = "2"
members = [
    "panel-contracts",
    "panel-errors",
    "panel-domain",
    "panel-ir",
    "panel-engine",
    "gateway-pingora",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/eltavine/pingora-panel"

[workspace.dependencies]
async-trait = "=0.1.92"
prost = "=0.14.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "sync"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "transport"] }
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
uuid = { version = "=1.18.1", features = ["serde", "v4"] }
