[workspace]
resolver = "2"
members = [
    "panel-contracts",
    "panel-errors",
    "panel-domain",
    "panel-ir",
    "panel-engine",
    "panel-gateway-runtime",
    "snapshot-store-fs",
    "gateway-pingora",
    "gateway-grpc",
    "gatewayd",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/eltavine/pingora-panel"

[workspace.dependencies]
arc-swap = "=1.9.2"
async-trait = "=0.1.92"
prost = "=0.14.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "router", "transport"] }
tonic-health = "=0.14.6"
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
uuid = { version = "=1.18.1", features = ["serde", "v4"] }
libc = "=0.2.189"
