[workspace]
resolver = "2"
members = [
    "panel-api",
    "panel-context",
    "panel-control-runtime",
    "panel-contracts",
    "panel-errors",
    "panel-events",
    "panel-event-codec",
    "panel-health",
    "panel-jobs",
    "panel-domain",
    "panel-config-domain",
    "panel-config-state-codec",
    "panel-application",
    "panel-outbox",
    "panel-pki",
    "panel-tls",
    "panel-platform",
    "panel-platform-codec",
    "panel-persistence-memory",
    "panel-postgres",
    "panel-service",
    "panel-config-json",
    "panel-config-model",
    "panel-dsl",
    "panel-config-dsl",
    "panel-ir",
    "panel-jetstream",
    "panel-engine",
    "panel-gateway-runtime",
    "snapshot-store-fs",
    "gateway-pingora",
    "gateway-proto-codec",
    "config-proto-codec",
    "config-grpc-client",
    "gateway-grpc",
    "gateway-grpc-client",
    "gatewayd",
    "config-service",
    "audit-service",
    "automation-service",
    "observability-service",
    "panel-bootstrap",
    "panel-api-server",
    "panel-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/eltavine/pingora-panel"
publish = false

[workspace.dependencies]
arc-swap = "=1.9.2"
axum = "=0.8.9"
async-nats = { version = "=0.50.0", default-features = false, features = ["jetstream", "kv", "nuid", "ring", "server_2_10", "server_2_11", "server_2_12", "server_2_14"] }
async-trait = "=0.1.92"
backon = { version = "=1.6.0", default-features = false, features = ["std"] }
base64 = "=0.22.1"
bytes = "=1.12.1"
clap = { version = "=4.6.6", features = ["derive", "env"] }
clap_complete = "=4.6.11"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde", "std"] }
futures-util = "=0.3.34"
config-grpc-client = { version = "=0.1.0", path = "config-grpc-client" }
config-proto-codec = { version = "=0.1.0", path = "config-proto-codec" }
config-service = { version = "=0.1.0", path = "config-service" }
gateway-grpc = { version = "=0.1.0", path = "gateway-grpc" }
gateway-grpc-client = { version = "=0.1.0", path = "gateway-grpc-client" }
gateway-proto-codec = { version = "=0.1.0", path = "gateway-proto-codec" }
gateway-pingora = { version = "=0.1.0", path = "gateway-pingora" }
getrandom = "=0.4.3"
globset = { version = "=0.4.20", default-features = false }
hex = "=0.4.3"
http = "=1.5.0"
http-body-util = "=0.1.5"
httpdate = "=1.0.3"
hyper = { version = "=1.11.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
hmac = "=0.13.0"
idna = "=1.1.0"
iri-string = "=0.7.14"
mediatype = "=0.23.0"
mime_guess = { version = "=2.0.5", default-features = false }
parking_lot = "=0.12.5"
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
percent-encoding = "=2.3.2"
prost = "=0.14.4"
prost-types = "=0.14.4"
panel-context = { version = "=0.1.0", path = "panel-context" }
panel-control-runtime = { version = "=0.1.0", path = "panel-control-runtime" }
panel-contracts = { version = "=0.1.0", path = "panel-contracts" }
panel-config-domain = { version = "=0.1.0", path = "panel-config-domain" }
panel-config-state-codec = { version = "=0.1.0", path = "panel-config-state-codec" }
panel-config-json = { version = "=0.1.0", path = "panel-config-json" }
panel-config-model = { version = "=0.1.0", path = "panel-config-model" }
panel-dsl = { version = "=0.1.0", path = "panel-dsl" }
panel-config-dsl = { version = "=0.1.0", path = "panel-config-dsl" }
panel-api = { version = "=0.1.0", path = "panel-api" }
panel-application = { version = "=0.1.0", path = "panel-application" }
panel-outbox = { version = "=0.1.0", path = "panel-outbox" }
panel-persistence-memory = { version = "=0.1.0", path = "panel-persistence-memory" }
panel-pki = { version = "=0.1.0", path = "panel-pki" }
panel-tls = { version = "=0.1.0", path = "panel-tls" }
panel-platform = { version = "=0.1.0", path = "panel-platform" }
panel-platform-codec = { version = "=0.1.0", path = "panel-platform-codec" }
panel-postgres = { version = "=0.1.0", path = "panel-postgres" }
panel-service = { version = "=0.1.0", path = "panel-service" }
panel-domain = { version = "=0.1.0", path = "panel-domain" }
panel-engine = { version = "=0.2.0", path = "panel-engine" }
panel-errors = { version = "=0.1.0", path = "panel-errors" }
panel-event-codec = { version = "=0.1.0", path = "panel-event-codec" }
panel-events = { version = "=0.1.0", path = "panel-events" }
panel-health = { version = "=0.1.0", path = "panel-health" }
panel-gateway-runtime = { version = "=0.2.0", path = "panel-gateway-runtime" }
panel-ir = { version = "=0.1.0", path = "panel-ir" }
panel-jetstream = { version = "=0.1.0", path = "panel-jetstream" }
panel-jobs = { version = "=0.1.0", path = "panel-jobs" }
pingora-core = { version = "=0.9.0", path = "../pingora-core", default-features = false }
pingora-http = { version = "=0.9.0", path = "../pingora-http", default-features = false }
pingora-load-balancing = { version = "=0.9.0", path = "../pingora-load-balancing", default-features = false }
pingora-proxy = { version = "=0.9.0", path = "../pingora-proxy", default-features = false }
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode-perl"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"
similar = "=3.2.0"
snapshot-store-fs = { version = "=0.2.0", path = "snapshot-store-fs" }
socket2 = { version = "=0.6.5", features = ["all"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["chrono", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
stringprep = "=0.1.5"
thiserror = "=2.0.21"
time = "=0.3.55"
tempfile = "=3.27.0"
tokio = { version = "=1.48.0", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tower = { version = "=0.5.3", features = ["util"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json"] }
rrule = "=0.14.0"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
rustls-webpki = { version = "=0.103.15", default-features = false, features = ["ring", "std"] }
tower-http = { version = "=0.7.1", features = ["fs", "request-id", "set-header", "trace"] }
utoipa = { version = "=5.5.0", features = ["chrono", "uuid"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "router", "transport"] }
tonic-health = "=0.14.6"
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
uuid = { version = "=1.18.1", features = ["serde", "v4", "v7"] }
libc = "=0.2.189"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt", "json"] }
