[workspace]
resolver = "2"
members = [
    "panel-contracts",
    "panel-errors",
    "panel-domain",
    "panel-config-domain",
    "panel-config-state-codec",
    "panel-ir",
    "panel-engine",
    "panel-gateway-runtime",
    "snapshot-store-fs",
    "gateway-pingora",
    "gateway-grpc",
    "gatewayd",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/eltavine/pingora-panel"
publish = false

[workspace.dependencies]
arc-swap = "=1.9.2"
async-trait = "=0.1.92"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
futures-util = "=0.3.34"
gateway-grpc = { version = "=0.1.0", path = "gateway-grpc" }
gateway-pingora = { version = "=0.1.0", path = "gateway-pingora" }
prost = "=0.14.4"
panel-contracts = { version = "=0.1.0", path = "panel-contracts" }
panel-config-domain = { version = "=0.1.0", path = "panel-config-domain" }
panel-config-state-codec = { version = "=0.1.0", path = "panel-config-state-codec" }
panel-domain = { version = "=0.1.0", path = "panel-domain" }
panel-engine = { version = "=0.1.0", path = "panel-engine" }
panel-errors = { version = "=0.1.0", path = "panel-errors" }
panel-gateway-runtime = { version = "=0.1.0", path = "panel-gateway-runtime" }
panel-ir = { version = "=0.1.0", path = "panel-ir" }
pingora-core = { version = "=0.8.1", path = "../pingora-core", default-features = false }
pingora-http = { version = "=0.8.1", path = "../pingora-http", default-features = false }
pingora-load-balancing = { version = "=0.8.1", path = "../pingora-load-balancing", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
snapshot-store-fs = { version = "=0.1.0", path = "snapshot-store-fs" }
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "router", "transport"] }
tonic-health = "=0.14.6"
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
uuid = { version = "=1.18.1", features = ["serde", "v4"] }
libc = "=0.2.189"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt", "json"] }
