[package]
name = "identity-oidc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A provider that signs people in for tests.
test-support = ["dep:axum"]

[dependencies]
async-trait.workspace = true
axum = { workspace = true, optional = true }
base64.workspace = true
bytes.workspace = true
jsonwebtoken.workspace = true
panel-errors.workspace = true
panel-identity.workspace = true
reqwest = { workspace = true, features = ["form", "rustls-no-provider"] }
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
url.workspace = true

[dev-dependencies]
chrono.workspace = true
identity-oidc = { workspace = true, features = ["test-support"] }
panel-context.workspace = true
panel-identity = { workspace = true, features = ["test-support"] }
panel-secrets.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
