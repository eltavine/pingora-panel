[package]
name = "plugin-contracts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
pbjson.workspace = true
prost.workspace = true
serde.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

[build-dependencies]
pbjson-build.workspace = true
protoc-bin-vendored = "=3.2.0"
tonic-prost-build.workspace = true

[dev-dependencies]
serde_json.workspace = true

[package.metadata.pingora-panel]
# Buf, not the Rust API check, guards what is generated from Protobuf.
generated-from = "protobuf"

[package.metadata.cargo-machete]
# Referenced only by the generated code and JSON mappings.
ignored = ["pbjson", "serde", "tonic-prost"]
