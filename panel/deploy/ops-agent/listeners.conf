# Lets the host agent name the processes listening on TCP ports. Installed
# as /etc/systemd/system/pingora-panel-ops-agent.service.d/listeners.conf.
#
# Reading other processes' descriptors takes CAP_DAC_READ_SEARCH and
# CAP_SYS_PTRACE; the system call filter still denies ptrace(2). /proc/net
# lists the host's sockets only in the host's network namespace, so the
# agent leaves its private one, though it still opens no network socket.

[Service]
Environment=PINGORA_PANEL_OPS_LISTENERS=on
CapabilityBoundingSet=CAP_DAC_READ_SEARCH CAP_SYS_PTRACE
AmbientCapabilities=CAP_DAC_READ_SEARCH CAP_SYS_PTRACE
PrivateNetwork=no
