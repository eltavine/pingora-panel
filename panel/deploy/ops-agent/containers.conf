# Lets the host agent list and manage what runs on Docker or Podman.
# Installed as
# /etc/systemd/system/pingora-panel-ops-agent.service.d/containers.conf.
#
# Whoever reaches an engine's socket is root on the host through the
# engine, and so is the agent with this drop-in; an operator can still
# disable each engine from the console. The agent joins the group that owns
# Docker's socket. Podman's socket belongs to root alone: give it a group
# with a podman.socket drop-in setting SocketGroup=, add that group below,
# and name the socket as podman=/run/podman/podman.sock, comma-separated
# after Docker's or alone.
#
# Which engines an operator disabled is kept in the state directory.

[Service]
Environment=PINGORA_PANEL_OPS_ENGINES=docker=/run/docker.sock
SupplementaryGroups=docker
StateDirectory=pingora-panel-ops
StateDirectoryMode=0700
