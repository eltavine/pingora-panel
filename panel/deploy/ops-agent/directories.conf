# Lets the host agent measure the gateway's volumes. install.sh installs it
# as /etc/systemd/system/pingora-panel-ops-agent.service.d/directories.conf,
# followed by where the engine keeps each volume: a read-only binding and
# the setting that names it.
#
# The volumes belong to the containers' users, so measuring them needs
# CAP_DAC_READ_SEARCH. The agent sees nothing else under /var, and none of
# the host's credentials, while it holds it.

[Service]
CapabilityBoundingSet=CAP_DAC_READ_SEARCH
AmbientCapabilities=CAP_DAC_READ_SEARCH
TemporaryFileSystem=/var:ro
InaccessiblePaths=-/etc/shadow -/etc/gshadow -/etc/ssh -/etc/ssl/private -/etc/sudoers -/etc/sudoers.d
