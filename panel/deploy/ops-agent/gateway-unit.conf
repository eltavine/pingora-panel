# Lets the host agent start, stop and restart the gateway's systemd unit.
# Installed as
# /etc/systemd/system/pingora-panel-ops-agent.service.d/gateway-unit.conf,
# beside pingora-panel-ops-agent.rules as
# /etc/polkit-1/rules.d/50-pingora-panel-ops-agent.rules, which allows the
# agent's user that one unit and nothing else. A gateway unit of another
# name needs both changed.

[Service]
Environment=PINGORA_PANEL_OPS_GATEWAY_UNIT=pingora-panel-gatewayd.service
