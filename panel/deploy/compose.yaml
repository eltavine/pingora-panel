# Pingora Panel on one Linux host, for Docker Compose and Podman Compose.
#
#   panel/deploy/generate-secrets.sh
#   docker compose -f panel/deploy/compose.yaml up -d
#
# Every process uses the host network. The control plane binds loopback
# addresses, so nothing but the gateway's configured listeners is reachable
# from other hosts until the API authenticates callers; the console is at
# http://127.0.0.1:8080. The control plane reaches the gateway and the host
# agent over mutual TLS with credentials the pki service rotates.

name: pingora-panel

x-panel: &panel
  image: ${PINGORA_PANEL_IMAGE:-localhost/pingora-panel:dev}
  build:
    context: ../..
    dockerfile: panel/deploy/Containerfile
  network_mode: host
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-control: &control
  PINGORA_PANEL_NATS_URL: nats://127.0.0.1:4222
  PINGORA_PANEL_TRUST_DOMAIN: pingora-panel.internal

x-after-bootstrap: &after-bootstrap
  bootstrap:
    condition: service_completed_successfully
  pki-init:
    condition: service_completed_successfully

x-pki: &pki
  <<: *panel
  environment:
    PINGORA_PANEL_PKI_DIR: /var/lib/pingora-panel/pki
    PINGORA_PANEL_TRUST_DOMAIN: pingora-panel.internal
    PINGORA_PANEL_PKI_CREDENTIALS: >-
      panel-api=/var/lib/pingora-panel/credentials/panel-api,config-service=/var/lib/pingora-panel/credentials/config-service,automation-service=/var/lib/pingora-panel/credentials/automation-service,observability-service=/var/lib/pingora-panel/credentials/observability-service,audit-service=/var/lib/pingora-panel/credentials/audit-service,plugins-service=/var/lib/pingora-panel/credentials/plugins-service,gatewayd=/var/lib/pingora-panel/credentials/gatewayd
  volumes:
    - pki-authority:/var/lib/pingora-panel/pki
    - credentials-panel-api:/var/lib/pingora-panel/credentials/panel-api
    - credentials-config-service:/var/lib/pingora-panel/credentials/config-service
    - credentials-automation-service:/var/lib/pingora-panel/credentials/automation-service
    - credentials-observability-service:/var/lib/pingora-panel/credentials/observability-service
    - credentials-audit-service:/var/lib/pingora-panel/credentials/audit-service
    - credentials-plugins-service:/var/lib/pingora-panel/credentials/plugins-service
    - credentials-gatewayd:/var/lib/pingora-panel/credentials/gatewayd

services:
  nats:
    image: docker.io/library/nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    network_mode: host
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data", "--addr", "127.0.0.1", "--port", "4222", "--http_port", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Keeps the gateway's metrics; only the control plane queries it.
  prometheus:
    image: docker.io/prom/prometheus:v3.15.0-distroless@sha256:b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # Publishes the host's CPU, memory, filesystems, load, network, release
  # and clock to Prometheus, reading the host's root without changing it.
  node-exporter:
    image: docker.io/prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    network_mode: host
    pid: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave

  # Keeps the gateway's access and error logs; only the control plane
  # queries it.
  loki:
    image: docker.io/grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      LOKI_DATA_DIR: /loki
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    tmpfs: [/tmp]

  # Ships the gateway's log files to Loki. It runs as the files' owner to
  # read them, without any capability to read other users' files.
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    network_mode: host
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      PINGORA_PANEL_LOG_DIR: /var/log/pingora-panel
      COLLECTOR_STORAGE_DIR: /var/lib/otelcol
      LOKI_OTLP_ENDPOINT: http://127.0.0.1:3100/otlp
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - gateway-logs:/var/log/pingora-panel:ro
      - collector-data:/var/lib/otelcol
    depends_on:
      loki:
        condition: service_started

  # Creates the certificate authority and every service's credentials.
  pki-init:
    <<: *pki
    restart: "no"
    command: ["/usr/local/bin/panel-bootstrap", "pki", "--once"]

  # Renews credentials before they expire; services reload them.
  pki:
    <<: *pki
    command: ["/usr/local/bin/panel-bootstrap", "pki"]
    depends_on:
      pki-init:
        condition: service_completed_successfully

  # Creates the event streams and the service registry.
  bootstrap:
    <<: *panel
    restart: "no"
    command: ["/usr/local/bin/panel-bootstrap"]
    environment:
      <<: *control
    depends_on:
      nats:
        condition: service_healthy

  gatewayd:
    <<: *panel
    command: ["/usr/local/bin/gatewayd"]
    # Root with two capabilities: binding ports below 1024 on the host
    # network, and reading the credentials and certificates other services
    # write as their own user. It writes only its state and logs.
    user: "0:0"
    cap_add: [NET_BIND_SERVICE, DAC_READ_SEARCH]
    environment:
      PINGORA_PANEL_GATEWAY_ADDR: 127.0.0.1:50051
      PINGORA_PANEL_STATE_DIR: /var/lib/pingora-panel/gateway
      PINGORA_PANEL_TLS_DIR: /var/lib/pingora-panel/credentials/gatewayd
      PINGORA_PANEL_TRUST_DOMAIN: pingora-panel.internal
      PINGORA_PANEL_SECRET_DIR: /var/lib/pingora-panel/gateway-secrets
      PINGORA_PANEL_STATIC_ROOT: /srv/pingora-panel/sites
      # Serves /metrics to Prometheus.
      PINGORA_PANEL_OPS_ADDR: 127.0.0.1:9185
      # Access and error logs, which otel-collector ships to Loki.
      PINGORA_PANEL_LOG_DIR: /var/log/pingora-panel
    volumes:
      - gateway-state:/var/lib/pingora-panel/gateway
      - gateway-logs:/var/log/pingora-panel
      - gateway-secrets:/var/lib/pingora-panel/gateway-secrets:ro
      - sites:/srv/pingora-panel/sites:ro
      - credentials-gatewayd:/var/lib/pingora-panel/credentials/gatewayd:ro
    depends_on:
      pki-init:
        condition: service_completed_successfully

  # The control plane: the API with the configuration, automation,
  # observability, audit and plugins modules in one process. Each module
  # keeps its own credentials, SQLite file and operational listener on
  # 127.0.0.1:9180-9184 and 9186. Signed plugins in the plugins volume run as
  # its child processes once trusted and enabled.
  control:
    <<: *panel
    command: ["/usr/local/bin/panel-control"]
    environment:
      <<: *control
      PINGORA_PANEL_CREDENTIALS_DIR: /var/lib/pingora-panel/credentials
      PINGORA_PANEL_HTTP_ADDR: 127.0.0.1:8080
      PINGORA_PANEL_WEB_ROOT: /usr/share/pingora-panel/web
      # The static sites the gateway serves, whose files the panel manages.
      PINGORA_PANEL_SITES_ROOT: /srv/pingora-panel/sites
      PINGORA_PANEL_GATEWAY_URL: https://127.0.0.1:50051
      PINGORA_PANEL_GATEWAY_SECRET_DIR: /var/lib/pingora-panel/gateway-secrets
      PINGORA_PANEL_PROMETHEUS_URL: http://127.0.0.1:9090
      PINGORA_PANEL_LOKI_URL: http://127.0.0.1:3100
      # Creates the first account once; any later use is refused.
      PINGORA_PANEL_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap-token
      # Keys password hashes; replacing it invalidates every password.
      PINGORA_PANEL_PASSWORD_PEPPER_FILE: /run/secrets/password-pepper
      # Seals certificate keys, identity provider secrets, refresh tokens,
      # alert channel secrets and plugins' secrets; losing them loses every
      # sealed value.
      PINGORA_PANEL_MASTER_KEYS_FILE: /run/secrets/master-keys
      # Signed plugin packages, as <name>/<version>/ directories.
      PINGORA_PANEL_PLUGINS_DIR: /var/lib/pingora-panel/plugins
      # gatewayd, or plugin:<name> for the gateway engine a plugin provides.
      PINGORA_PANEL_GATEWAY_ENGINE: ${PINGORA_PANEL_GATEWAY_ENGINE:-gatewayd}
      # The images pingora-panel deployed and how, as the versions report
      # names them; empty for an installation started by hand.
      PINGORA_PANEL_DEPLOYMENT: ${PINGORA_PANEL_DEPLOYMENT:-}
    secrets: [bootstrap-token, password-pepper, master-keys]
    volumes:
      - control-data:/var/lib/pingora-panel/control
      - gateway-secrets:/var/lib/pingora-panel/gateway-secrets
      - sites:/srv/pingora-panel/sites
      - credentials-panel-api:/var/lib/pingora-panel/credentials/panel-api:ro
      - credentials-config-service:/var/lib/pingora-panel/credentials/config-service:ro
      - credentials-automation-service:/var/lib/pingora-panel/credentials/automation-service:ro
      - credentials-observability-service:/var/lib/pingora-panel/credentials/observability-service:ro
      - credentials-audit-service:/var/lib/pingora-panel/credentials/audit-service:ro
      - credentials-plugins-service:/var/lib/pingora-panel/credentials/plugins-service:ro
      - plugins:/var/lib/pingora-panel/plugins
    healthcheck:
      test: ["CMD", "/usr/local/bin/panel-control", "healthcheck"]
      interval: 5s
      timeout: 15s
      retries: 30
    depends_on: *after-bootstrap

secrets:
  bootstrap-token:
    file: ./secrets/bootstrap-token
  password-pepper:
    file: ./secrets/password-pepper
  master-keys:
    file: ./secrets/master-keys

volumes:
  # The control plane's SQLite files, one per module.
  control-data:
  nats-data:
  prometheus-data:
  loki-data:
  collector-data:
  gateway-state:
  gateway-logs:
  gateway-secrets:
  sites:
  pki-authority:
  credentials-panel-api:
  credentials-config-service:
  credentials-automation-service:
  credentials-observability-service:
  credentials-audit-service:
  credentials-plugins-service:
  credentials-gatewayd:
  # Signed plugin packages the control plane may run.
  plugins:
