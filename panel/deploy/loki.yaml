# Keeps the gateway's access and error logs (ADR 0025). The collector sends
# records over OTLP; only observability-service queries them. Started with
# -config.expand-env=true, so the defaults below can be overridden.
auth_enabled: false

server:
  http_listen_address: ${LOKI_HTTP_ADDRESS:-127.0.0.1}
  http_listen_port: ${LOKI_HTTP_PORT:-3100}
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: ${LOKI_GRPC_PORT:-9096}
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: ${LOKI_DATA_DIR:-/loki}
  storage:
    filesystem:
      chunks_directory: ${LOKI_DATA_DIR:-/loki}/chunks
      rules_directory: ${LOKI_DATA_DIR:-/loki}/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION:-720h}
  allow_structured_metadata: true
  # Clearing a site's logs is a delete request.
  deletion_mode: filter-and-delete

compactor:
  working_directory: ${LOKI_DATA_DIR:-/loki}/compactor
  compaction_interval: 5m
  retention_enabled: true
  delete_request_store: filesystem
  # How long a delete request can be cancelled before it is applied.
  delete_request_cancel_period: 5m

analytics:
  reporting_enabled: false
